name: activity

# L104: four bounded snapshots per hour replace #1243's 310 event fan-outs.
# Main's definition calls no model and activity gates nothing (L46).
on:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: activity
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  set:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 loop/builder.py activity
