name: activity
run-name: Activity

# L104: the commit status `activity` on each open `build/` PR head says which loop run works on it, from the PR's runs and
# labels alone. It runs main's copy, calls no model, and no ruleset or `just ready` reads it (L46). A write that fails
# exits 4 here and fails only this sample. Shared reads bound calls regardless of the workflow event rate.
on:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: activity
  cancel-in-progress: false

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  set:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 loop/builder.py activity
