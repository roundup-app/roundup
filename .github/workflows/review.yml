name: review
run-name: Review ${{ github.event.workflow_run.head_branch }}

# L24: one review run per PR head, once `pre` (the lints) passes on it. A workflow_run job runs main's copy of this file, so no PR
# changes its own review. The review run holds a read token and answers in a fixed schema; `post` publishes the answer
# as a VERDICT comment and the `review` status the ruleset requires; a reject starts a fix run. The tests run alongside it.
# It runs on Sonnet, which spends less of the weekly Claude limit than Opus.
on:
  workflow_run:
    workflows: [pre]
    types: [completed]

# The newest head of a branch wins; an older head's review has nothing left to decide. pre names a draft's run
# `Draft check`: its completion gets a group of its own, so it cannot cancel a ready head's review.
concurrency:
  group: review-${{ github.event.workflow_run.display_title == 'Draft check' && format('draft-{0}', github.event.workflow_run.id) || format('branch-{0}', github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  task:
    if: >-
      github.event.workflow_run.display_title != 'Draft check' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ fromJSON(vars.BOXD_LIGHT == '1' && format('["self-hosted","boxd","roundup-light-task-{0}-{1}"]', github.run_id, github.run_attempt) || '["ubuntu-24.04"]') }}
    # L24: an unchanged diff keeps its approval here (`carried`), which sets the `review` status.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      pr: ${{ steps.task.outputs.pr }}
      head: ${{ github.event.workflow_run.head_sha }}
      prompt: ${{ steps.task.outputs.prompt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$HEAD\") | .number")
          [ -n "$pr" ] || exit 0
          code=0
          python3 loop/builder.py review-task "$pr" "$HEAD" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: a draft, or the PR moved on; `gh pr ready` reruns pre and so this review.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  review-run:
    needs: task
    if: needs.task.outputs.pr != ''
    # L121: a PR in `BOXD_PRS` is reviewed on boxd, whose snapshot carries Codex.
    runs-on: ${{ fromJSON(contains(fromJSON(vars.BOXD_PRS || '[]'), fromJSON(needs.task.outputs.pr || '0')) && format('["self-hosted","boxd","roundup-review-{0}-{1}-{2}"]', needs.task.outputs.pr, github.run_id, github.run_attempt) || '["ubuntu-24.04"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      ran: ${{ steps.ran.outputs.ran }}
    env:
      # L23: the switch; set, Claude Code runs on API credit (`loop/builder.py` `claude_env`).
      CLAUDE_API: ${{ vars.CLAUDE_API }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.task.outputs.head }}
          fetch-depth: 0
          # Blobs load on demand: history still holds the 2.5 GB of evidence #5484 removed from the tree.
          filter: blob:none
          persist-credentials: false
      - name: Install main's reviewer instructions
        run: |
          git show origin/main:loop/review-checkout.sh | bash
          cp -R loop "$RUNNER_TEMP/loop"
      - name: Verify prepared boxd toolchain
        if: runner.environment == 'self-hosted'
        run: |
          git show origin/main:.github/actions/setup/action.yml >"$RUNNER_TEMP/setup.yml"
          python3 /opt/roundup-ci/image.py verify "$RUNNER_TEMP/setup.yml"
      - id: claude
        if: vars.CODEX_ONLY == '' && vars.CLAUDE_API == ''
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ needs.task.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools Bash,Read,Glob,Grep,Skill
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # CODEX_ONLY, without CLAUDE_API: the same prompt and schema on Codex, signed in with the ChatGPT login, holding the job's read token only.
      - name: Install Codex
        if: runner.environment != 'self-hosted' && vars.CODEX_ONLY != '' && vars.CLAUDE_API == ''
        run: npm install -g @openai/codex@0.161.0
      - id: codex
        if: vars.CODEX_ONLY != '' && vars.CLAUDE_API == ''
        env:
          CODEX_ONLY: ${{ vars.CODEX_ONLY }}
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/loop/builder.py" engine-read-only '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # Claude Code at the version the setup action pins; the job runs no setup.
      - name: Install Claude Code
        if: vars.CLAUDE_API != ''
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.296
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      # CLAUDE_API: the same prompt and schema on Claude Code over API credit (`ANTHROPIC_API_KEY`), holding the job's read token only.
      - id: api
        if: vars.CLAUDE_API != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/loop/builder.py" claude-read-only review '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # The answer travels as an artifact: a job output holding a model answer is dropped when it matches a secret's mask.
      - name: Keep the answer
        if: always()
        env:
          ANSWER: ${{ steps.claude.outputs.structured_output || steps.codex.outputs.structured_output || steps.api.outputs.structured_output }}
        run: printf '%s' "$ANSWER" >"$RUNNER_TEMP/answer.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: answer
          path: ${{ runner.temp }}/answer.txt
          overwrite: true  # a rerun's answer replaces the earlier attempt's, which download would otherwise pick (#5924)
      # A usage limit or a setup failure leaves no tool use; post then leaves `review` pending for a rerun.
      - id: ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || steps.codex.outputs.execution_file || steps.api.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"

  # Runs when the review run fails too: a run that did no model work leaves `review` pending for a rerun; one that
  # worked and gave no answer becomes an `error` status and a question to the user.
  post:
    needs: [task, review-run]
    if: ${{ !cancelled() && needs.task.outputs.pr != '' }}
    runs-on: ${{ fromJSON(vars.BOXD_LIGHT == '1' && format('["self-hosted","boxd","roundup-light-post-{0}-{1}"]', github.run_id, github.run_attempt) || '["ubuntu-24.04"]') }}
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v6
        continue-on-error: true  # a run that died before its answer step leaves none; post then reads an empty answer
        with:
          name: answer
          path: ${{ runner.temp }}/answer
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.task.outputs.pr }}
          HEAD: ${{ needs.task.outputs.head }}
          RAN: ${{ needs.review-run.outputs.ran || 'false' }}
        run: |
          { cat "$RUNNER_TEMP/answer/answer.txt" 2>/dev/null || true; } | python3 loop/builder.py review-post "$PR" "$HEAD" "reviewer-$GITHUB_RUN_ID" "$RAN"
