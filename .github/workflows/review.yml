name: review
run-name: Review ${{ github.event.workflow_run.head_branch }}

# L24: one review run per PR head, once check passes on it. A workflow_run job runs main's copy of this file, so no PR
# changes its own review. The review run holds a read token and answers in a fixed schema; `post` publishes the answer
# as a VERDICT comment and the `review` status the ruleset requires, and a reject starts a fix run. It runs on Sonnet,
# which spends less of the weekly Claude limit than Opus.
on:
  workflow_run:
    workflows: [check]
    types: [completed]

# The newest head of a branch wins; an older head's review has nothing left to decide. check names a draft's run
# `Draft check`: its completion gets a group of its own, so it cannot cancel a ready head's review.
concurrency:
  group: review-${{ github.event.workflow_run.display_title == 'Draft check' && format('draft-{0}', github.event.workflow_run.id) || format('branch-{0}', github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  task:
    if: >-
      github.event.workflow_run.display_title != 'Draft check' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pr: ${{ steps.task.outputs.pr }}
      head: ${{ github.event.workflow_run.head_sha }}
      prompt: ${{ steps.task.outputs.prompt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$HEAD\") | .number")
          [ -n "$pr" ] || exit 0
          code=0
          python3 loop/builder.py review-task "$pr" "$HEAD" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: a draft, or the PR moved on; `gh pr ready` reruns check and so this review.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  review-run:
    needs: task
    if: needs.task.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      ran: ${{ steps.ran.outputs.ran }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.task.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install main's reviewer instructions
        run: |
          git show origin/main:loop/review-checkout.sh | bash
          cp -R loop "$RUNNER_TEMP/loop"
      - id: claude
        if: vars.CODEX_ONLY == ''
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ needs.task.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools Bash,Read,Glob,Grep,Skill
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # CODEX_ONLY: the same prompt and schema on Codex, signed in with the ChatGPT login, holding the job's read token only.
      - name: Install Codex
        if: vars.CODEX_ONLY != ''
        run: npm install -g @openai/codex@0.161.0
      - id: codex
        if: vars.CODEX_ONLY != ''
        env:
          CODEX_ONLY: ${{ vars.CODEX_ONLY }}
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/loop/builder.py" engine-read-only '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # The answer travels as an artifact: a job output holding a model answer is dropped when it matches a secret's mask.
      - name: Keep the answer
        if: always()
        env:
          ANSWER: ${{ steps.claude.outputs.structured_output || steps.codex.outputs.structured_output }}
        run: printf '%s' "$ANSWER" >"$RUNNER_TEMP/answer.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: answer
          path: ${{ runner.temp }}/answer.txt
      # A usage limit or a setup failure leaves no tool use; post then leaves `review` pending for a rerun.
      - id: ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || steps.codex.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"

  # Runs when the review run fails too: a run that did no model work leaves `review` pending for a rerun; one that
  # worked and gave no answer becomes an `error` status and a question to the user.
  post:
    needs: [task, review-run]
    if: ${{ !cancelled() && needs.task.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v6
        continue-on-error: true  # a run that died before its answer step leaves none; post then reads an empty answer
        with:
          name: answer
          path: ${{ runner.temp }}/answer
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.task.outputs.pr }}
          HEAD: ${{ needs.task.outputs.head }}
          RAN: ${{ needs.review-run.outputs.ran || 'false' }}
        run: |
          { cat "$RUNNER_TEMP/answer/answer.txt" 2>/dev/null || true; } | python3 loop/builder.py review-post "$PR" "$HEAD" "reviewer-$GITHUB_RUN_ID" "$RAN"

  summary:
    needs: [task, review-run, post]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Independently review a PR head
      next: An approval passes the review status; a reject on a Builder PR starts a fix run.
