name: check
# Trusted downstream workflows distinguish a skipped draft event even after the PR becomes ready.
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft check' || 'Check' }}

on:
  workflow_dispatch:
  # A draft's head is skipped: its Builder is still pushing red tests. ready_for_review runs check on the finished
  # head, which starts its review (L24).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# L82: a newer push cancels an older run, on a PR and on `main` alike: only the newest `main` commit's run goes on.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && format('draft-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

# L89: a PR's lanes test only what its diff reaches (`loop/affected.py`): the merge ref's first parent is the `main` it
# merges into. An empty base, on every other event, tests everything.
env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # L89: the Rust checks that run no test binary.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: python3 loop/app-data.py just lint-rust

  # L89: the Rust suite in two halves. `hash` keeps each test in its half across commits, so a PR's half and `main`'s
  # half hold the same tests (L82). L84: on `main`, `rust 1` builds every test target, so it saves the Linux cache.
  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: rust ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ matrix.partition == 1 }}
      - name: test-rust
        run: python3 loop/app-data.py just test-rust-since "$BASE" --partition hash:${{ matrix.partition }}/2 --test-threads 8

  # L89: the code Linux never compiles or runs: clippy on macOS, the tests that take a macOS path, and the daemon smoke
  # test, on the OS the App ships on.
  mac:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: setup
        uses: ./.github/actions/setup
        with:
          save-cache: 'true'
      - run: just clippy
      # L89: a failed check leaves later steps running, so one run reports every failure.
      - name: test-rust
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 loop/app-data.py just test-rust-since "$BASE" --profile mac
      - name: hello-world round trip (rup ping through rupd)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cargo build -p rupd -p rup
          python3 loop/app-data.py bash loop/ci-ping.sh
      - name: N7 N8 real Daemon guard observers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 loop/app-data.py python3 loop/app-data.test.py
          python3 loop/app-data.py python3 loop/launch-sites.test.py

  # L89: the web checks that run no test.
  lint-web:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - run: python3 loop/app-data.py just lint-web

  # L89: the web tests in six shards; vitest's `--shard` sorts the test files by their path's hash and gives each shard
  # an equal count.
  web:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: web ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust: 'build'
          browser: 'true'
      # The real-`rupd` tests run these binaries: built here from the restored cache, no test waits on the build.
      - run: cargo build -p rupd -p rup
      - name: U26 Linux fault observer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bpftrace libfuse3-dev fuse3 pkg-config
      - name: U26 held file-backed fault
        run: python3 loop/app-data.py python3 tools/chromium-faults/test.py
      - name: test-web
        run: python3 loop/app-data.py python3 tools/chromium-faults/observe.py --log "$RUNNER_TEMP/chromium-faults-${{ matrix.partition }}.jsonl" -- just test-web-since "$BASE" --shard=${{ matrix.partition }}/${{ strategy.job-total }}
      - name: Chromium file fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-faults-${{ matrix.partition }}
          path: ${{ runner.temp }}/chromium-faults-${{ matrix.partition }}.jsonl
          retention-days: 7

  # Keep the required check name; neither a skipped nor failed lane can turn it green. L82: when a newer push cancels
  # this run, the gate ends `cancelled`: it blocks merge, starts no fix run and leaves `main` unjudged.
  check:
    needs: [lint, rust, mac, lint-web, web]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'map_values(.result) | ., all(.[]; . == "success")' <<<"$NEEDS"

  summary:
    needs: [lint, rust, mac, lint-web, web, check]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check Rust and web behavior
      next: Success starts review of this head; a failure blocks merge and starts a fix run on a Builder PR.
