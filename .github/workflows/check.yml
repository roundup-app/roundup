name: check
# Trusted downstream workflows distinguish a skipped draft event even after the PR becomes ready.
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft check' || 'Check' }}

on:
  workflow_dispatch:
  # A draft's head is skipped: its Builder is still pushing red tests. ready_for_review runs check on the finished
  # head, which starts its review (L24).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# L82: a newer push cancels an older run, on a PR and on `main` alike: only the newest `main` commit's run goes on.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && format('draft-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

# L89: a PR's lanes test only what its diff reaches (`loop/affected.py`): the merge ref's first parent is the `main` it
# merges into. An empty base, on every other event, tests everything.
env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # L89: the Rust checks that run no test binary.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: just lint-rust

  # L89: the Rust suite in two halves. `hash` keeps each test in its half across commits, so a PR's half and `main`'s
  # half hold the same tests (L82).
  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: rust ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: test-rust
        run: just test-rust-since "$BASE" --partition hash:${{ matrix.partition }}/2 --test-threads 8

  # L89: the code Linux never compiles or runs: clippy on macOS, the tests that take a macOS path, and the daemon smoke
  # test, on the OS the App ships on.
  mac:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: setup
        uses: ./.github/actions/setup
        with:
          save-cache: 'true'
      - run: just clippy
      # L89: a failed check leaves later steps running, so one run reports every failure.
      - name: test-rust
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just test-rust-since "$BASE" --profile mac
      - name: hello-world round trip (rup ping through rupd)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          export RUPD_SOCKET="$RUNNER_TEMP/rupd.sock"
          cargo build -p rupd -p rup
          ./target/debug/rupd & 
          for _ in $(seq 20); do [ -S "$RUPD_SOCKET" ] && break; sleep 0.25; done
          [[ $(./target/debug/rup ping) == *pong* ]]
          kill %1

  web:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          browser: 'true'
      - name: check-web
        run: just check-web "$BASE"

  # L84: main's proof that Builders' runner runs `just check-rust` whole, while `web` runs `check-web` on the same
  # image; it also saves the Linux cache, since it builds every target. A PR never runs it and the gate does not read it.
  linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'
      - run: just check-rust

  # Keep the required check name; neither a skipped nor failed lane can turn it green. L82: when a newer push cancels
  # this run, the gate ends `cancelled`: it blocks merge, starts no fix run and leaves `main` unjudged.
  check:
    needs: [lint, rust, mac, web]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          RUST: ${{ needs.rust.result }}
          MAC: ${{ needs.mac.result }}
          WEB: ${{ needs.web.result }}
        run: test "$LINT" = success && test "$RUST" = success && test "$MAC" = success && test "$WEB" = success

  summary:
    needs: [lint, rust, mac, web, linux, check]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check Rust and web behavior
      next: Success starts review of this head; a failure blocks merge and starts a fix run on a Builder PR.
