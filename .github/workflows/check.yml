name: check
# Trusted downstream workflows distinguish a skipped draft event even after the PR becomes ready.
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft check' || 'Check' }}

on:
  workflow_dispatch:
  # A draft's head is skipped: its Builder is still pushing red tests. ready_for_review runs check on the finished
  # head, which starts its review (L24).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# L82: a newer push cancels an older run, on a PR and on `main` alike: only the newest `main` commit's run goes on.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && format('draft-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

# L89: a PR's lanes test only what its diff reaches (`loop/affected.py`): the merge ref's first parent is the `main` it
# merges into. An empty base, on every other event, tests everything.
env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # L89: the Rust checks that run no test binary.
  lint:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: python3 loop/app-data.py just lint-rust

  # L89: the Rust suite in five lanes, one test thread per vCPU of the 4-vCPU runner: more threads than vCPUs starve
  # the timed waits of daemons, fake Claude and sqlite. Each lane compiles the test binaries for about 90 s before its
  # tests; a build job whose nextest archive the lanes download is no shorter: one compile stays on the path, with the
  # archive's upload, download and unpacking after it. Lane N runs profile `ciN` of `.config/nextest.toml`, which names
  # the test binaries packed to equal seconds; a test stays in its lane across commits, so a PR's lane and `main`'s hold
  # the same tests (L82).
  # L84: on `main`, `rust 1` builds every test target, so it saves the Linux cache.
  rust:
    if: true
    name: rust ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition: [2]
    runs-on: [self-hosted, boxd]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ matrix.partition == 1 }}
      - name: test-rust
        run: python3 loop/app-data.py just test-rust-since "$BASE" --profile ci${{ matrix.partition }} --test-threads 4

  # L89: clippy on macOS, whose `target_os = "macos"` code Linux never compiles. A lane of its own, in step with the
  # tests of `mac`: clippy's 36 s of work and its setup run beside them, not before. `mac` saves the cache.
  mac-clippy:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - run: just clippy

  # L89: the tests that take a macOS path, and the daemon smoke test, on the OS the App ships on.
  mac:
    if: false
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: setup
        uses: ./.github/actions/setup
        with:
          save-cache: 'true'
          node: 'false'
      # L89: a failed check leaves later steps running, so one run reports every failure.
      - name: test-rust
        run: python3 loop/app-data.py just test-rust-since "$BASE" --profile mac
      - name: hello-world round trip (rup ping through rupd)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cargo build -p rupd -p rup
          python3 loop/app-data.py bash loop/ci-ping.sh
      - name: N7 N8 real Daemon guard observers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 loop/app-data.py python3 loop/app-data.test.py
          python3 loop/app-data.py python3 loop/launch-sites.test.py

  # L89: the web checks that run no test, then the two U26 regression tests that hold Chromium's startup for real seconds:
  # neither depends on which web tests run, so they run once here and not in every shard. The lint takes 40 s, so the
  # held tests fit in this lane without a runner of their own. A failed step leaves later steps running, so one run
  # reports every failure.
  lint-web:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          browser: 'true'
      - run: python3 loop/app-data.py just lint-web
      - id: deps
        name: U26 Linux fault observer dependencies
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bpftrace libfuse3-dev fuse3 pkg-config
      - name: U26 held cold startup regression
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 loop/app-data.py python3 tools/chromium-faults/cold.test.py
      - name: U26 held file-backed fault
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 loop/app-data.py python3 tools/chromium-faults/test.py

  # L89: the web tests in seven shards; `--shard` goes through the sequencer of `apps/desktop/src/testing/shardSequencer.ts`,
  # which gives each test file, longest first, to the shard it makes finish soonest by the durations measured on `main`
  # (`just web-durations`), a file with none weighing the median. A full run is about 24 runner-minutes of tests; a PR's
  # diff usually reaches far fewer.
  web:
    if: false
    name: web ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust: 'build'
          browser: 'true'
      - name: U26 Linux fault observer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bpftrace libfuse3-dev fuse3 pkg-config
      # This must be the runner's first browser command, before any warmup or regression fixture.
      - name: U26 concurrent cold Chromium
        run: python3 loop/app-data.py python3 tools/chromium-faults/observe.py --log "$RUNNER_TEMP/chromium-cold-faults-${{ matrix.partition }}.jsonl" -- node --experimental-strip-types tools/chromium-faults/cold.mts "$RUNNER_TEMP/chromium-cold-${{ matrix.partition }}.jsonl"
      - name: test-web
        run: python3 loop/app-data.py python3 tools/chromium-faults/observe.py --log "$RUNNER_TEMP/chromium-faults-${{ matrix.partition }}.jsonl" -- just test-web-since "$BASE" --shard=${{ matrix.partition }}/${{ strategy.job-total }}
      - name: Chromium file fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-faults-${{ matrix.partition }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromium-faults-${{ matrix.partition }}.jsonl
            ${{ runner.temp }}/chromium-cold-faults-${{ matrix.partition }}.jsonl
            ${{ runner.temp }}/chromium-cold-${{ matrix.partition }}.jsonl
          retention-days: 7

  # L24: GitHub may build a draft's `synchronize` run from a payload older than the PR's `ready_for_review`: the ready run
  # then tests the previous head and the newest head is left with a `Draft check`, which `review` and `critic` skip, so
  # no real check ever runs on it (#1931, #1933, #1998, #2023). A Draft check whose PR is ready on its own head, with no
  # real check run on that head, turns the PR draft and ready again as the Claude App, whose events start workflows
  # (a `GITHUB_TOKEN`'s do not), and re-arms the auto-merge that turning it draft disarmed.
  rekick:
    if: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready() { gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" | jq -e --arg head "$HEAD" '(.draft | not) and .head.sha == $head' >/dev/null; }
          ready || exit 0
          # The ready run, if it tested this head, appears within seconds.
          sleep 30
          ready || exit 0
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$HEAD&event=pull_request" \
            | jq -e '[.workflow_runs[] | select(.display_title == "Check" and .conclusion != "cancelled")] | length > 0' >/dev/null && exit 0
          echo 'stale=true' >>"$GITHUB_OUTPUT"
      - if: steps.stale.outputs.stale
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - if: steps.stale.outputs.stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merge=$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // empty')
          # `app_token` prints its own `::add-mask::` line before returning the token; the last line is the token.
          APP_TOKEN=$(python3 -c 'import sys; sys.path.insert(0, "loop"); import builder; print(builder.app_token())' | tail -n 1)
          echo "::add-mask::$APP_TOKEN"
          export GH_TOKEN=$APP_TOKEN
          trap 'gh api -X DELETE /installation/token' EXIT
          gh pr ready "$PR" --undo
          gh pr ready "$PR"
          [ -z "$merge" ] || gh pr merge "$PR" --auto "--$(tr "[:upper:]" "[:lower:]" <<<"$merge")"

  # Keep the required check name; neither a skipped nor failed lane can turn it green. L82: when a newer push cancels
  # this run, the gate ends `cancelled`: it blocks merge, starts no fix run and leaves `main` unjudged.
  check:
    needs: [lint, rust, mac-clippy, mac, lint-web, web]
    if: false
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'map_values(.result) | ., all(.[]; . == "success")' <<<"$NEEDS"

  summary:
    needs: [lint, rust, mac-clippy, mac, lint-web, web, check]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check Rust and web behavior
      next: Success starts review of this head; a failure blocks merge and starts a fix run on a Builder PR.
