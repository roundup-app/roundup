name: check
# Trusted downstream workflows distinguish a skipped draft event even after the PR becomes ready.
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft check' || 'Check' }}

on:
  workflow_dispatch:
  # A draft's head is skipped: its Builder is still pushing red tests. ready_for_review runs check on the finished
  # head, whose `pre` run starts its review (L24).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# L82: a newer push cancels an older run, on a PR and on `main` alike: only the newest `main` commit's run goes on.
# A push to `main` has its own group per commit, so a merge never cancels the run of the commit before it.
concurrency:
  group: check-${{ github.event_name == 'push' && format('push-{0}', github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.draft && format('draft-{0}', github.ref) || github.ref) }}
  cancel-in-progress: true

# L24: on a PR, the lanes start with the push, alongside `pre`, the review run and the design critic run. Merge waits for
# `check`, `rules`, `review` and `critic` all (L46), so no head merges unreviewed; a reject starts a fix run whose push
# supersedes this run (L82).
#
# L89: a PR's lanes test only what its diff reaches (`loop/affected.py`): the merge ref's first parent is the `main` it
# merges into. An empty base, on every other event, tests everything.
env:
  # A new experiment title starts an isolated cache; pushes with the same title restore it.
  CI3781_CACHE: >-
    ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'CI3781 experiment: ') && format('pr{0}-{1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # L89: on a PR, what the diff reaches decides which lanes run; a lane the diff misses is skipped at job level and
  # holds no runner. `main` pushes have no base, so `affected.py` prints `all` and every lane runs. The runner's own
  # cargo suffices: `affected.py` only reads the manifests, and `stable` keeps rustup from fetching the pinned toolchain.
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      web_shards: ${{ steps.shards.outputs.web_shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Depth 2 holds HEAD and HEAD^1, all that BASE, affected.py and the migration guard read; a full fetch of
          # every branch took 1 to 47 min on 2026-10-28.
          fetch-depth: 2
      - name: B4522 migration filename boundaries
        run: |
          guard=tools/migrations/guard.py
          if [ -n "$BASE" ]; then
            base=$(git rev-parse --verify "$BASE^{commit}")
            # Once installed, a PR cannot expand its own duplicate exceptions.
            if git cat-file -e "$base:tools/migrations/guard.py" 2>/dev/null; then
              trusted=$(mktemp -d)
              git show "$base:tools/migrations/guard.py" > "$trusted/guard.py"
              git show "$base:tools/migrations/recorded.json" > "$trusted/recorded.json"
              guard="$trusted/guard.py"
            fi
          fi
          python3 "$guard" "$BASE"
          python3 tools/migrations/guard.test.py
      - name: C9 artifact checker boundaries
        run: python3 tools/release/check.test.py
      # N7: every launch reference has an entry; the `mac` lane, which runs the rest of N7, skips App-only PRs.
      - run: python3 loop/app-data.py python3 loop/launch-sites.test.py LaunchSites.test_n7_launch_sites_use_owned_data
      - id: plan
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rust_base="$BASE"
          if [ -n "$CI3781_CACHE" ]; then rust_base=''; fi
          rust=$(python3 loop/affected.py rust "$rust_base")
          # C4 observers/fixtures live outside the crate graph. Select their existing Rust lane too.
          if [ -n "$rust_base" ] && ! git diff --quiet "$rust_base" -- tools/contracts/; then
            rust=all
          fi
          web=$(python3 loop/affected.py web "$BASE")
          # The capture registry is imported by vite.config.ts and browser fixtures. Its 96-file selection
          # timed out in two serial-heavy shards in run 40970125076; use the full configuration lane set.
          if [ -n "$BASE" ] && ! git diff --quiet "$BASE" -- apps/desktop/src/testing/captures.ts; then
            web=all
          fi
          {
            echo "rust=${rust:+true}"
            echo "web=${web:+true}"
            # Only a PR whose diff selects some web tests, not all, counts the files that size the shards.
            echo "count=$([ -n "$web" ] && [ "$web" != all ] && echo true)"
          } >>"$GITHUB_OUTPUT"
      - if: steps.plan.outputs.count
        uses: ./.github/actions/setup
        with:
          rust: 'false'
      - id: shards
        env:
          COUNT: ${{ steps.plan.outputs.count }}
        run: |
          files=all
          if [ -n "$COUNT" ]; then
            # Count the same related selection test-web-since runs, including affected.py's source-reading tests.
            # Run 40977204278 counted only --changed and timed out both undersized web shards after 15 minutes.
            sources=$(python3 loop/affected.py web "$BASE")
            SOURCES="$sources" python3 loop/app-data.py pnpm --filter desktop exec node --input-type=module - >"$RUNNER_TEMP/web-files.txt" <<'JS'
          import { createVitest } from 'vitest/node';
          const ctx = await createVitest({ related: process.env.SOURCES.split('\n'), watch: false, run: true });
          try {
            for (const spec of await ctx.getRelevantTestSpecifications()) console.log(`[${spec.project.name}] ${spec.moduleId}`);
          } finally {
            await ctx.close();
          }
          JS
            files=$(grep -c '\.test\.tsx\?$' "$RUNNER_TEMP/web-files.txt" || true)
            # Capture metadata reached 70 serial heavy files on #4987: two file-count shards both exceeded
            # 15 min (run 40970178062). Use the full matrix when Vitest selects its heavy project.
            if grep -q '^\[heavy\] ' "$RUNNER_TEMP/web-files.txt"; then files=all; fi
          fi
          echo "web_shards=$(python3 loop/affected.py shards "$files")" >>"$GITHUB_OUTPUT"

  # L89: the Rust suite in five lanes, one test thread per vCPU of the 4-vCPU runner: more threads than vCPUs starve
  # the timed waits of daemons, fake Claude and sqlite. Each lane compiles the test binaries for about 90 s before its
  # tests; a build job whose nextest archive the lanes download is no shorter: one compile stays on the path, with the
  # archive's upload, download and unpacking after it. Lane N runs profile `ciN` of `.config/nextest.toml`, which names
  # the test binaries packed to equal seconds; a test stays in its lane across commits, so a PR's lane and `main`'s hold
  # the same tests (L82).
  # L84: on `main`, `rust 1` builds every test target, so it saves the Linux cache.
  rust:
    needs: plan
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.plan.outputs.rust == 'true')
    env:
      BASE: >-
        ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'CI3781 experiment: ') && 'HEAD^1' || '' }}
    name: rust ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    # A cold Rust cache restore under a full runner pool makes setup build `rupd` for up to 16 min (2026-10-22); the test step has its own 15 min limit for a hung test.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          # Empty BASE makes the unchanged R26 baseline guard read origin/main.
          fetch-depth: ${{ env.CI3781_CACHE != '' && '0' || '2' }}
          # Repeated experiment pushes retain their source tree despite unrelated main merges.
          ref: ${{ env.CI3781_CACHE != '' && github.event.pull_request.head.sha || '' }}
      - name: E14 whole-runner memory observer
        run: |
          python3 -m pip install -r tools/e14/requirements.txt
          setsid python3 tools/e14/observe.py memory --output "$RUNNER_TEMP/e14-memory.jsonl" >"$RUNNER_TEMP/e14-memory.log" 2>&1 </dev/null &
      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ matrix.partition == 1 }}
          experiment-cache: ${{ env.CI3781_CACHE }}
      - name: C9b native release size
        if: matrix.partition == 1
        run: |
          cargo build --locked --release -p rupd
          mkdir -p target/release-evidence
          git rev-parse HEAD > target/release-evidence/commit.txt
          rustc -Vv > target/release-evidence/toolchain.txt
          uname -a > target/release-evidence/host.txt
          cp Cargo.toml target/release-evidence/Cargo.toml
          python3 tools/release/check.py binary target/release/rupd | tee target/release-evidence/size.json
      - name: C9 native evidence
        if: ${{ always() && matrix.partition == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ github.run_attempt }}
          path: target/release-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: A4691 debug runtime preparation
        run: just build-debug
      - name: C4 addition and freshness observers
        if: matrix.partition == 1
        run: just contracts-test
      - name: U4251 raw SDK storage capability
        if: matrix.partition == 1
        timeout-minutes: 1
        run: node --test crates/agents/sidecar/storage.test.mjs
      - name: CI4018 experiment cache regression
        if: matrix.partition == 1
        run: node --test .github/actions/setup/cache.test.mjs
      - name: E12 network observer dependencies
        run: |
          if ! command -v strace || ! command -v ip || ! command -v setpriv; then
            sudo apt-get update -qq
            sudo apt-get install -y strace iproute2 util-linux
          fi
      # B32 compares Rust with executable Bend; setup stays outside the network-free test.
      - name: Pinned Bend for model correspondence
        run: just proofs-setup
      - name: test-rust
        timeout-minutes: 15
        run: |
          python3 -m pip install -r tools/e14/requirements.txt
          observation=()
          if [ -n "$CI3781_CACHE" ]; then observation+=(--build-observation); fi
          python3 tools/e14/observe.py run "${observation[@]}" --lane rust${{ matrix.partition }} --base "$BASE" --memory-log "$RUNNER_TEMP/e14-memory.jsonl" --output "$RUNNER_TEMP/e14/rust${{ matrix.partition }}" --cache-state "setup action; restore outcomes in the run's setup log"
      - name: E14 observer regression
        if: ${{ !cancelled() && matrix.partition == 1 }}
        run: python3 tools/e14/observe.test.py
      - name: E14 Rust measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e14-rust${{ matrix.partition }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e14/
            ${{ runner.temp }}/e14-memory.*
          if-no-files-found: error
          retention-days: 30

  # L89: clippy on macOS, whose `target_os = "macos"` code Linux never compiles. A lane of its own, in step with the
  # tests of `mac`: clippy's 36 s of work and its setup run beside them, not before. `mac` saves the cache.
  mac-clippy:
    needs: plan
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.plan.outputs.rust == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - run: just clippy
      - name: Z4280a fresh desktop build
        if: ${{ !cancelled() }}
        run: |
          fresh_target=$(mktemp -d "$RUNNER_TEMP/z4280a.XXXXXX")
          CARGO_TARGET_DIR="$fresh_target" cargo build --locked -p desktop 2>&1 | tee "$RUNNER_TEMP/z4280a-build.log"
          ! grep -F 'Modifiers::SUPER' "$RUNNER_TEMP/z4280a-build.log"
      - name: Z4280a build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z4280a-macos-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/z4280a-build.log
          if-no-files-found: error
          retention-days: 30

  # L89: the tests that take a macOS path, and the daemon smoke test, on the OS the App ships on.
  mac:
    needs: plan
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.plan.outputs.rust == 'true')
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          # CI5458c: run 41353339920 spent 108 s checking out 2.3 GB of historical perf evidence.
          # Keep every build/test input; these archives are not inputs to this lane's commands.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/crates/perf/evidence/
      - id: setup
        uses: ./.github/actions/setup
        with:
          save-cache: 'true'
          # CI5458c: run 41349105933 spent 44 s installing Node packages and 50 s saving their cache.
          # Only the main-only S1 packaging commands need them.
          node: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - name: C9b native release size
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo build --locked --release -p rupd
          mkdir -p target/release-evidence
          git rev-parse HEAD > target/release-evidence/commit.txt
          rustc -Vv > target/release-evidence/toolchain.txt
          uname -a > target/release-evidence/host.txt
          cp Cargo.toml target/release-evidence/Cargo.toml
          python3 tools/release/check.py binary target/release/rupd | tee target/release-evidence/size.json
      - name: C9 native evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ github.run_attempt }}
          path: target/release-evidence/
          if-no-files-found: error
          retention-days: 30
      # L89: a failed check leaves later steps running, so one run reports every failure.
      - name: test-rust
        run: python3 loop/app-data.py just test-rust-since "$BASE" --profile mac
      # R24: compile the opt-in native producer as well as the normal-build exclusion tests above.
      - name: R24 measurement feature
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 loop/app-data.py cargo nextest run -p desktop --features idle-perf --profile mac -E 'test(/^idle::tests::r24_/)'
      - name: hello-world round trip (rup ping through rupd)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cargo build -p rupd -p rup
          python3 loop/app-data.py bash loop/ci-ping.sh
      - name: N7 N8 real Daemon guard observers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 loop/app-data.py python3 loop/app-data.test.py
          python3 loop/app-data.py python3 loop/launch-sites.test.py

      - name: S1 macOS App bundle
        id: app-bundle
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          mkdir -p target/app-bundle-evidence
          git rev-parse HEAD > target/app-bundle-evidence/commit.txt
          {
            uname -a
            sw_vers
            printf 'Runner: %s %s %s\nImage: %s %s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME" "$ImageOS" "$ImageVersion"
            rustc -Vv
            cargo -V
            node --version
            pnpm --version
            xcodebuild -version
          } > target/app-bundle-evidence/identity.txt 2>&1
          just app-bundle 2>&1 | tee target/app-bundle-evidence/build.log
      - name: S1 S3 A12a X8 extracted App bundle observer
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.app-bundle.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          just app-bundle-check "target/$triple/release/bundle/macos/roundup.app" 2>&1 | tee target/app-bundle-evidence/observer.log
      - name: S1 macOS packaging evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-macos-${{ github.run_attempt }}
          path: target/app-bundle-evidence/
          if-no-files-found: error
          retention-days: 30

  # L89: the web tests in seven shards; `--shard` goes through the sequencer of `apps/desktop/src/testing/shardSequencer.ts`,
  # which gives each test file, longest first, to the shard it makes finish soonest by the durations measured on `main`
  # (`just web-durations`), a file with none weighing the median. A full run is about 24 runner-minutes of tests; a PR's
  # diff usually reaches far fewer.
  web:
    needs: plan
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.plan.outputs.web == 'true')
    name: web ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.plan.outputs.web_shards || '[1]') }}
    runs-on: ubuntu-24.04
    # A cold Rust cache restore under a full runner pool makes setup build `rupd` for up to 16 min (2026-10-22); the test step has its own 15 min limit for a hung test.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: E14 whole-runner memory observer
        run: |
          python3 -m pip install -r tools/e14/requirements.txt
          setsid python3 tools/e14/observe.py memory --output "$RUNNER_TEMP/e14-memory.jsonl" >"$RUNNER_TEMP/e14-memory.log" 2>&1 </dev/null &
      - uses: ./.github/actions/setup
        with:
          rust: 'build'
          browser: 'true'
      - name: CI5330a disk before tests
        run: bash .github/actions/setup/disk.sh report before
      - name: C9c production desktop size
        if: matrix.partition == 1
        run: |
          pnpm --filter desktop build
          python3 tools/release/check.py modules target/release-modules.json --inventory tools/release/inventory.json --dist apps/desktop/dist
          mkdir -p target/release-evidence
          git rev-parse HEAD > target/release-evidence/commit.txt
          python3 tools/release/check.py dist apps/desktop/dist | tee target/release-evidence/dist.json
      - name: C9 desktop evidence
        if: ${{ always() && matrix.partition == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: release-web-${{ github.run_attempt }}
          path: |
            target/release-evidence/
            target/release-modules.json
          if-no-files-found: error
          retention-days: 30
      - name: U26 Linux fault observer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bpftrace libfuse3-dev fuse3 pkg-config
      # This must be the runner's first browser command, before any warmup or regression fixture.
      - name: U26 concurrent cold Chromium
        run: python3 loop/app-data.py python3 tools/chromium-faults/observe.py --log "$RUNNER_TEMP/chromium-cold-faults-${{ matrix.partition }}.jsonl" -- node --experimental-strip-types tools/chromium-faults/cold.mts "$RUNNER_TEMP/chromium-cold-${{ matrix.partition }}.jsonl"
      - name: test-web
        timeout-minutes: 15
        run: |
          python3 -m pip install -r tools/e14/requirements.txt
          python3 tools/e14/observe.py run --lane web${{ matrix.partition }} --shards ${{ strategy.job-total }} --base "$BASE" --memory-log "$RUNNER_TEMP/e14-memory.jsonl" --output "$RUNNER_TEMP/e14/web${{ matrix.partition }}" --cache-state "setup action; restore outcomes in the run's setup log"
      - name: CI5330a disk after tests
        if: always()
        run: bash .github/actions/setup/disk.sh report after
      - name: E14 web measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e14-web${{ matrix.partition }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e14/
            ${{ runner.temp }}/e14-memory.*
          if-no-files-found: error
          retention-days: 30
      - name: Chromium file fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-faults-${{ matrix.partition }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromium-faults-${{ matrix.partition }}.jsonl
            ${{ runner.temp }}/chromium-cold-faults-${{ matrix.partition }}.jsonl
            ${{ runner.temp }}/chromium-cold-${{ matrix.partition }}.jsonl
          retention-days: 7

  # L89: the two U26 regression tests that hold Chromium's startup for real seconds. Neither depends on which web tests
  # run, so they run once here, on their own runner beside the web shards, and not in every shard.
  chromium:
    needs: plan
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.plan.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          browser: 'true'
      - name: CI5330a disk before tests
        run: bash .github/actions/setup/disk.sh report before
      - name: R3800 startup artifact checker observers
        run: node --test apps/desktop/budgets/*.test.mjs
      # A failed build or checker fails this job, and `check` needs it to succeed.
      - name: R3800 production entry budget
        run: |
          pnpm --filter desktop build
          pnpm --filter desktop check:startup
      - name: T3797a real-tool lint observers
        run: pnpm --filter lint-boundaries test:boundaries
      - name: U26 Linux fault observer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bpftrace libfuse3-dev fuse3 pkg-config
      - name: U26 held cold startup regression
        run: python3 loop/app-data.py python3 tools/chromium-faults/cold.test.py
      - name: U26 held file-backed fault
        if: ${{ !cancelled() }}
        run: python3 loop/app-data.py python3 tools/chromium-faults/test.py
      - name: CI5330a disk after tests
        if: always()
        run: bash .github/actions/setup/disk.sh report after

  # Keep the required check name. A failed lane cannot turn it green; a skipped lane can only on a PR, where `plan` (which must
  # itself succeed) skipped it (L89). L82: when a newer push cancels
  # this run, the gate ends `cancelled`: it blocks merge, starts no fix run and leaves `main` unjudged.
  # L46: a draft run's skipped job takes another name. GitHub counts a skipped required check as passed, and the ready run
  # creates its own `check` only after its lanes end, so a skipped draft `check` on the same head let #5430 merge red.
  check:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'check (draft)' || 'check' }}
    needs: [plan, rust, mac-clippy, mac, web, chromium]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT" 'map_values(.result) | ., (.plan == "success" and all(.[]; . == "success" or ($event == "pull_request" and . == "skipped")))' <<<"$NEEDS"

  summary:
    needs: [plan, rust, mac-clippy, mac, web, chromium, check]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check Rust and web behavior
      next: Success lets the PR merge; a failure blocks merge and starts a fix run on a Builder PR.
