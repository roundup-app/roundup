name: L82 renewed live observation
on:
  workflow_dispatch:

concurrency:
  group: l82-post-1452-observer
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      # OIDC mints only the existing read-only App token; no repository writes.
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      head: ${{ steps.source.outputs.head }}
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            timeout 60s git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" start-measurement
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        run: echo "head=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Validate renewed criterion fixtures
        run: python3 loop/fix-observer.test.py
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - name: Collect the complete post-1452 window
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/fix-observer.py collect --repo "$REPOSITORY" --directory "$RUNNER_TEMP/l82-post-1452"
      - id: upload
        # A failed read retains its partial raw pages too, but cannot enable publication.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: l82-post-1452-${{ github.run_attempt }}
          path: ${{ runner.temp }}/l82-post-1452
          if-no-files-found: error
          retention-days: 90
      - name: Finish API measurement
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" finish-measurement
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     token_source='unknown', resource='all', used=None, remaining=None, reset=None,
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: loop-api-fix-observer-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: collect
    if: github.ref == 'refs/heads/main' && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            timeout 60s git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" start-measurement
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.collect.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact }}
          path: ${{ runner.temp }}/l82-post-1452
          merge-multiple: true
      - name: Publish retained results on both live Issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT: ${{ needs.collect.outputs.artifact }}
        run: python3 loop/fix-observer.py publish --repo "$REPOSITORY" --directory "$RUNNER_TEMP/l82-post-1452" --artifact-id "$ARTIFACT"
      - name: Finish API measurement
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" finish-measurement
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     token_source='unknown', resource='all', used=None, remaining=None, reset=None,
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: loop-api-fix-observer-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  summary:
    needs: [collect, publish]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Retain and publish the separate L82 post-1452 observation
      next: '#1350 independently validates every retained live criterion and preserves both complete artifacts through a reviewed evidence PR before expiry. Failed or unobserved criteria keep #1290/#1350 open.'
