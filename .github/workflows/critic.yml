name: critic
run-name: Critic ${{ github.event.workflow_run.head_branch }}

# L103: one design-critic run per PR head that changes apps/desktop/src, once check passes on it; a PR that changes
# nothing there gets `critic` success with no model run. A workflow_run job runs main's copy of this file, so no PR
# changes its own critic. The run holds a read token and answers in a fixed schema; `post` publishes the answer as a
# CRITIC comment and the `critic` status the ruleset requires, and a reject starts a fix run with cause `critic`.
on:
  workflow_run:
    workflows: [check]
    types: [completed]

# The newest head of a branch wins; an older head's critique has nothing left to decide.
concurrency:
  group: critic-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  task:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      pr: ${{ steps.task.outputs.pr }}
      head: ${{ github.event.workflow_run.head_sha }}
      prompt: ${{ steps.task.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$HEAD\") | .number")
          [ -n "$pr" ] || exit 0
          code=0
          python3 loop/builder.py critic-task "$pr" "$HEAD" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: a draft, the PR moved on, or no UI change (critic already success); `gh pr ready` reruns check and so this run.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          python3 loop/builder.py prompt design-critic <"$RUNNER_TEMP/task.md"
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  critic-run:
    name: 'critic #${{ needs.task.outputs.pr }} ${{ needs.task.outputs.head }}'
    needs: task
    if: needs.task.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      answer: ${{ steps.claude.outputs.structured_output }}
      ran: ${{ steps.ran.outputs.ran }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.task.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install main's critic instructions
        run: |
          git show origin/main:loop/review-checkout.sh | bash
          git restore --source=origin/main --worktree -- docs/design-system.md docs/wireframes.md GLOSSARY.md
          cp -R loop "$RUNNER_TEMP/loop"
      # L103: the harness captures of main and of the head need the app's toolchain, from main's setup action.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .loop-main
          sparse-checkout: .github/actions/setup
          persist-credentials: false
      - uses: ./.loop-main/.github/actions/setup
        # Installation reads the PR's package scripts, so it also gets no exchange credential.
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          browser: 'true'
      - id: read-token
        run: python3 "$RUNNER_TEMP/loop/builder.py" read-token
      - id: claude
        uses: anthropics/claude-code-action@v1
        # The model receives a read token and cannot use the job's exchange credential.
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        with:
          prompt: ${{ needs.task.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.read-token.outputs.token }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools Bash,Read,Glob,Grep,Skill
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # A usage limit or a setup failure leaves no tool use; post then leaves `critic` pending for a rerun.
      - id: ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"

  # Runs when the review run fails too: a run that did no model work leaves `critic` pending for a rerun; one that
  # worked and gave no answer becomes an `error` status and a question to the user.
  post:
    needs: [task, critic-run]
    if: ${{ !cancelled() && needs.task.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.task.outputs.pr }}
          HEAD: ${{ needs.task.outputs.head }}
          ANSWER: ${{ needs.critic-run.outputs.answer }}
          RAN: ${{ needs.critic-run.outputs.ran || 'false' }}
        run: printf '%s' "$ANSWER" | python3 loop/builder.py critic-post "$PR" "$HEAD" "critic-$GITHUB_RUN_ID" "$RAN"

  summary:
    needs: [task, critic-run, post]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Judge a UI PR head against the user's design bar
      next: An approval passes the critic status; a reject on a Builder PR starts a fix run.
