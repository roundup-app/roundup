name: critic
run-name: Critic ${{ github.event.workflow_run.head_branch }}

# L103: one design-critic run per PR head that changes apps/desktop/src, once `pre` passes on it; a PR that changes
# nothing there gets `critic` success with no model run. A workflow_run job runs main's copy of this file, so no PR
# changes its own critic. The run holds a read token and answers in a fixed schema; `post` publishes the answer as a
# CRITIC comment and the `critic` status the ruleset requires, and a reject starts a fix run with cause `critic`.
on:
  workflow_run:
    workflows: [pre]
    types: [completed]

# Workflow concurrency precedes task admission: isolate draft completions before they can cancel a real run.
# Newer real heads still supersede older heads on the same branch.
concurrency:
  group: critic-${{ github.event.workflow_run.display_title == 'Draft check' && format('draft-{0}', github.event.workflow_run.id) || format('branch-{0}', github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  task:
    if: >-
      github.event.workflow_run.display_title != 'Draft check' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      pr: ${{ steps.task.outputs.pr }}
      head: ${{ github.event.workflow_run.head_sha }}
      prompt: ${{ steps.task.outputs.prompt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$HEAD\") | .number")
          [ -n "$pr" ] || exit 0
          code=0
          python3 loop/builder.py critic-task "$pr" "$HEAD" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: a draft, the PR moved on, or no UI change (critic already success); `gh pr ready` reruns pre and so this run.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          python3 loop/builder.py prompt design-critic <"$RUNNER_TEMP/task.md"
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  critic-run:
    name: 'critic #${{ needs.task.outputs.pr }} ${{ needs.task.outputs.head }}'
    needs: task
    if: needs.task.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      answer: ${{ steps.app-data-check.outcome == 'success' && (steps.claude.outputs.structured_output || steps.codex.outputs.structured_output || steps.api.outputs.structured_output) || '' }}
      ran: ${{ steps.ran.outputs.ran }}
    env:
      # L23: the switch; set, Claude Code runs on API credit (`loop/builder.py` `claude_env`).
      CLAUDE_API: ${{ vars.CLAUDE_API }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.task.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install main's critic instructions
        run: |
          git show origin/main:loop/review-checkout.sh | bash
          git restore --source=origin/main --worktree -- docs/design-system.md docs/wireframes.md GLOSSARY.md
          cp -R loop "$RUNNER_TEMP/loop"
      # L103: the harness captures of main and of the head need the app's toolchain, from main's setup action.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .loop-main
          sparse-checkout: .github/actions/setup
          persist-credentials: false
      - uses: ./.loop-main/.github/actions/setup
        with:
          browser: 'true'
          builder: ${{ vars.CODEX_ONLY != '' }}
      - name: Guard test commands from the model
        id: app-data
        run: python3 "$RUNNER_TEMP/loop/app-data.py" --job-start "$RUNNER_TEMP/n8-state.json"
      - id: claude
        if: vars.CODEX_ONLY == '' && vars.CLAUDE_API == ''
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ needs.task.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude,github-actions
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools Bash,Read,Glob,Grep,Skill
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # CODEX_ONLY, without CLAUDE_API: the same prompt and schema on Codex, signed in with the ChatGPT login, holding the job's read token only.
      - id: codex
        if: vars.CODEX_ONLY != '' && vars.CLAUDE_API == ''
        env:
          CODEX_ONLY: ${{ vars.CODEX_ONLY }}
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/loop/builder.py" engine-read-only '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # Claude Code at the version the setup action pins; the job runs no setup.
      - name: Install Claude Code
        if: vars.CLAUDE_API != ''
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.296
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      # CLAUDE_API: the same prompt and schema on Claude Code over API credit (`ANTHROPIC_API_KEY`), holding the job's read token only.
      - id: api
        if: vars.CLAUDE_API != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/loop/builder.py" claude-read-only critic '{"type":"object","properties":{"verdict":{"enum":["approve","reject"]},"findings":{"type":"string"}},"required":["verdict","findings"]}'
      # The answer travels as an artifact: a job output holding a model answer is dropped when it matches a secret's mask.
      - name: Keep the answer
        if: always()
        env:
          ANSWER: ${{ steps.claude.outputs.structured_output || steps.codex.outputs.structured_output || steps.api.outputs.structured_output }}
        run: printf '%s' "$ANSWER" >"$RUNNER_TEMP/answer.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: answer
          path: ${{ runner.temp }}/answer.txt
      # A usage limit or a setup failure leaves no tool use; post then leaves `critic` pending for a rerun.
      - id: ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || steps.codex.outputs.execution_file || steps.api.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"
      - name: Inspect guarded App data
        id: app-data-check
        if: always() && steps.app-data.outcome == 'success'
        env:
          TEST_JOB_STATUS: ${{ job.status }}
        run: python3 "$RUNNER_TEMP/loop/app-data.py" --job-finish "$RUNNER_TEMP/n8-state.json" "$TEST_JOB_STATUS"

  # Runs when the critic run fails too: a run that did no model work leaves `critic` pending for a rerun; one that
  # worked and gave no answer becomes an `error` status and a question to the user.
  post:
    needs: [task, critic-run]
    if: ${{ !cancelled() && needs.task.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v6
        continue-on-error: true  # a run that died before its answer step leaves none; post then reads an empty answer
        with:
          name: answer
          path: ${{ runner.temp }}/answer
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.task.outputs.pr }}
          HEAD: ${{ needs.task.outputs.head }}
          RAN: ${{ needs.critic-run.outputs.ran || 'false' }}
        run: |
          { cat "$RUNNER_TEMP/answer/answer.txt" 2>/dev/null || true; } | python3 loop/builder.py critic-post "$PR" "$HEAD" "critic-$GITHUB_RUN_ID" "$RAN"

  summary:
    needs: [task, critic-run, post]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Judge a UI PR head against the user's design bar
      next: An approval passes the critic status and, with the review's, starts the tests; a reject on a Builder PR starts a fix run.
