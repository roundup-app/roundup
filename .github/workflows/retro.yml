name: retro
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: retro
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  collect:
    outputs:
      head: ${{ steps.source.outputs.head }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    # A busy day needs several hourly read budgets before the single model run.
    timeout-minutes: 360
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" measurement-start
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: source
        run: echo "head=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - id: read-token
        run: python3 loop/builder.py read-token
      - name: Collect fixed-window input
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/retro.py --repo "$REPOSITORY" input > "$RUNNER_TEMP/retro-input.json"
      - uses: actions/upload-artifact@v4
        with:
          name: retro-input
          path: ${{ runner.temp }}/retro-input.json
      - name: Finish API measurement
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" measurement-finish
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-api-retro-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  retro:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" measurement-start
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: retro-input
          path: ${{ runner.temp }}
      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude,github-actions
          prompt: |
            Read .agents/retro.md and follow it. The fixed input is ${{ runner.temp }}/retro-input.json.
            Return the publication plan as structured output. The script publishes it after you finish.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools Read,Glob,Grep,Bash
            --json-schema '{"type":"object","properties":{"analysis":{"type":"string"},"repairs":{"type":"array","maxItems":3,"items":{"type":"object","properties":{"title":{"type":"string"},"body":{"type":"string"},"match":{"type":"integer"},"evidence":{"type":"string"}},"required":["title","body","evidence"]}},"ask":{"type":"string"}},"required":["analysis","repairs","ask"]}'
      - name: Publish report and bounded repairs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PLAN: ${{ steps.claude.outputs.structured_output }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/retro-plan.json"
          python3 loop/retro.py --repo "$REPOSITORY" publish "$RUNNER_TEMP/retro-input.json" "$RUNNER_TEMP/retro-plan.json"
      - name: Finish API measurement
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" measurement-finish
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-api-retro-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90
