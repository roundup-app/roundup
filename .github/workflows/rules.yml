name: rules

on:
  pull_request:

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # L46: the ruleset requires this job by its name, `rules`.
  rules:
    runs-on: ubuntu-24.04
    # L89: a failed step leaves the later ones running, so one run reports every failure.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Blobs load on demand: history still holds the 2.5 GB of evidence #5484 removed from the tree.
          filter: blob:none
      - run: loop/rules.sh merge-loss
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      - run: loop/rules.sh vocab
        if: ${{ !cancelled() }}
      - run: loop/rules.sh architect-words
        if: ${{ !cancelled() }}
      - run: loop/rules.sh tokens
        if: ${{ !cancelled() }}
      - run: loop/rules.test.sh
        if: ${{ !cancelled() }}
      - run: loop/qa-sweep.test.sh
        if: ${{ !cancelled() }}
