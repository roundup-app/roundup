name: build
run-name: Build ready work Issues

# L23: one-shot build runs. `pick` starts the fix runs open Builder PRs need and fills the free build slots, up to
# `MAX`, with ready work Issues. Each Issue runs build-issue.yml, whose own `after` starts the next pick as soon as
# that Issue's model did work, so the slots work as a pool rather than a batch.
# claude-code-action rejects push events, so a merge starts the build once `check` ends on `main`. The user's or a loop
# App's new or reopened Issue and a removed `flag:needs-user` or `flag:needs-mac` each add work (L34), so each starts
# a pick.
on:
  workflow_run:
    workflows: [check, retro, care]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  issues:
    types: [opened, reopened, unlabeled]
  workflow_dispatch:
    inputs:
      max:
        description: Build jobs at most
        required: false
        default: '16'

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # One pick at a time, so two triggers never start one Issue twice; build jobs of earlier runs keep running.
  pick:
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'unlabeled' && contains(fromJSON('["flag:needs-user", "flag:needs-mac"]'), github.event.label.name)) ||
      (contains(fromJSON('["opened", "reopened"]'), github.event.action) &&
       contains(fromJSON('["saadshahd", "claude[bot]", "github-actions[bot]"]'), github.event.issue.user.login))
    runs-on: ubuntu-latest
    concurrency:
      group: build-pick
      cancel-in-progress: false
    permissions:
      id-token: write
      actions: write
      contents: read
      issues: read
      pull-requests: read
    outputs:
      rows: ${{ steps.pick.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '16' }}
        run: |
          rows=$(python3 loop/builder.py pick "$MAX" 2>"$RUNNER_TEMP/pick.err") || { cat "$RUNNER_TEMP/pick.err" >&2; exit 1; }
          # L96: a stuck invalid order shows on the run.
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/pick.err" >&2
          echo "rows=$rows" >>"$GITHUB_OUTPUT"

  # Each Issue's build and its own `after` run in build-issue.yml, so one Issue's end never waits on another's.
  build:
    needs: pick
    if: needs.pick.outputs.rows != '[]'
    name: 'build #${{ matrix.row.issue }}'
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.pick.outputs.rows) }}
    # The union of what build-issue.yml's jobs need; its build job narrows to read access, so the Builder holds no write.
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/build-issue.yml
    with:
      issue: ${{ matrix.row.issue }}
      slug: ${{ matrix.row.slug }}
    secrets: inherit

  # L106: existing workflow Actions-write authority dispatches; neither Builder nor Retro receives it.
  retro-observer:
    if: >-
      github.event_name != 'issues' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.name == 'retro')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: l106-observer
      cancel-in-progress: false
    permissions:
      id-token: write
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: observer-token
        run: python3 loop/builder.py observer-token write
      - name: Observe diagnostic collector dispatch
        env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/retro-observer.py --collector --repo "$REPOSITORY" --directory "$RUNNER_TEMP/l106-observer"
      - if: ${{ !cancelled() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
        env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/retro-observer.py --repo "$REPOSITORY" --directory "$RUNNER_TEMP/l106-observer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l106-observer
          path: ${{ runner.temp }}/l106-observer
          if-no-files-found: ignore

  # L107: dispatch and observation authority belongs to this non-model job only.
  care-observer:
    if: >-
      github.event_name != 'issues' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.name == 'care')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: l107-observer
      cancel-in-progress: false
    permissions:
      id-token: write
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: observer-token
        run: python3 loop/builder.py observer-token write
      - env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/care-observer.py --repo "$REPOSITORY" --directory "$RUNNER_TEMP/l107-observer"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: l107-observer
          path: ${{ runner.temp }}/l107-observer
          if-no-files-found: ignore
          retention-days: 90
      - name: Repeat only after the successful snapshot is preserved
        if: ${{ success() && steps.evidence.outputs.artifact-url != '' }}
        env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/care-observer.py --repeat --repo "$REPOSITORY" --directory "$RUNNER_TEMP/l107-observer"

  # L23/L82: dispatch authority stays outside Builder/model jobs; evidence never sets a gate.
  branch-observer:
    if: github.event_name != 'issues' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: l23-l82-observer
      cancel-in-progress: false
    permissions:
      id-token: write
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: observer-token
        run: python3 loop/builder.py observer-token write
      - env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/branch-observer.py --repo "$REPOSITORY" --directory "$RUNNER_TEMP/branch-observer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-observer
          path: ${{ runner.temp }}/branch-observer
          if-no-files-found: ignore

  # L82: read-only fix observation; upload precedes the linked report. No model or fix dispatch.
  fix-observer:
    if: github.event_name != 'issues' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: l82-fix-observer
      cancel-in-progress: false
    permissions:
      id-token: write
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: observer-token
        run: python3 loop/builder.py observer-token read
      - name: Test bounded fix evidence fixtures
        run: python3 loop/fix-observer.test.py
      - name: Collect the complete six-hour fix window
        env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 loop/fix-observer.py --repo "$REPOSITORY" --directory "$RUNNER_TEMP/fix-observer"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: fix-observer
          path: ${{ runner.temp }}/fix-observer
          if-no-files-found: ignore
          retention-days: 90
      - name: Link the persisted evidence
        if: ${{ !cancelled() && steps.evidence.outputs.artifact-url != '' }}
        env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: python3 loop/fix-observer.py --repo "$REPOSITORY" --directory "$RUNNER_TEMP/fix-observer" --publish "$ARTIFACT_URL"

  summary:
    needs: [pick, build]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Build ready work Issues
      next: Each PR goes through check and review to auto-merge; a draft with a Stopped line goes where its screen sends it.
