name: build
run-name: Build ready work Issues

# L23: one-shot build runs. Build jobs and fix runs share the Codex slots the repository variable `CODEX_RUNS` sets.
# `pick` starts the fix runs open Builder PRs need, then fills the slots left with ready work Issues. Each Issue runs build-issue.yml, whose own `after` starts the next pick as soon as
# that Issue's model did work, so the slots work as a pool rather than a batch.
# claude-code-action rejects push events, so a merge starts the build once `check` ends on `main`. The user's or a loop
# App's new or reopened Issue and a removed `flag:needs-user` or `flag:needs-mac` each add work (L34), so each starts
# a pick.
on:
  workflow_run:
    workflows: [check]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  issues:
    types: [opened, reopened, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # One pick at a time, so two triggers never start one Issue twice; build jobs of earlier runs keep running.
  pick:
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'unlabeled' && contains(fromJSON('["flag:needs-user", "flag:needs-mac"]'), github.event.label.name)) ||
      (contains(fromJSON('["opened", "reopened"]'), github.event.action) &&
       contains(fromJSON('["saadshahd", "claude[bot]", "github-actions[bot]"]'), github.event.issue.user.login))
    runs-on: ubuntu-latest
    concurrency:
      group: build-pick
      cancel-in-progress: false
    permissions:
      id-token: write
      actions: write
      contents: write
      issues: read
      pull-requests: read
    outputs:
      rows: ${{ steps.pick.outputs.rows }}
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            timeout 60s git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" start-measurement
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_RUNS: ${{ vars.CODEX_RUNS }}
        run: |
          rows=$(python3 loop/builder.py pick "$CODEX_RUNS" 2>"$RUNNER_TEMP/pick.err") || { cat "$RUNNER_TEMP/pick.err" >&2; exit 1; }
          # L96: a stuck invalid order shows on the run.
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/pick.err" >&2
          echo "rows=$rows" >>"$GITHUB_OUTPUT"

      - name: Finish API measurement
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" finish-measurement
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     token_source='unknown', resource='all', used=None, remaining=None, reset=None,
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: loop-api-build-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90


  # Each Issue's build and its own `after` run in build-issue.yml, so one Issue's end never waits on another's.
  build:
    needs: pick
    if: needs.pick.outputs.rows != '[]'
    name: 'build #${{ matrix.row.issue }}'
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.pick.outputs.rows) }}
    # The union of what build-issue.yml's jobs need; its build job narrows to read access, so the Builder holds no write.
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/build-issue.yml
    with:
      issue: ${{ matrix.row.issue }}
      slug: ${{ matrix.row.slug }}
    secrets: inherit

  summary:
    needs: [pick, build]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Build ready work Issues
      next: Each PR goes through check and review to auto-merge; a draft with a Stopped line goes where its screen sends it.
