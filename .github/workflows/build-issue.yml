name: build-issue

# L23: one build job and its own `after`, called once per Issue by build.yml's matrix. Each Issue's `after` runs as
# soon as its build ends, so a finished job frees its slot and starts the next pick without waiting for the other
# Issues of its run. `after` holds the write token the Builder never sees.
on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: number
      slug:
        required: true
        type: string

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    # A second job for one Issue waits, then finds the first one's PR and starts no run.
    concurrency:
      group: build-${{ inputs.issue }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(contains(fromJSON(vars.BOXD_ISSUES || '[]'), inputs.issue) && format('["self-hosted","boxd","roundup-build-{0}-{1}-{2}"]', inputs.issue, github.run_id, github.run_attempt) || '["ubuntu-24.04"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      ran: ${{ steps.worked.outputs.ran }}
    env:
      ISSUE: ${{ inputs.issue }}
      SLUG: ${{ inputs.slug }}
      # L23: the switch; set, Claude Code runs on API credit (`loop/builder.py` `claude_env`).
      CLAUDE_API: ${{ vars.CLAUDE_API }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          clean: false
          persist-credentials: false
      # The Builder switches this checkout to its branch; the end of the job runs main's copy.
      - run: cp -R loop "$RUNNER_TEMP/loop" && mkdir "$RUNNER_TEMP/.agents" && cp .agents/screen.md "$RUNNER_TEMP/.agents/"
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          builder: 'true'
      - name: Stamp Builder commits
        run: bash loop/author.sh "builder-$GITHUB_RUN_ID"
      # L34: the hour's closed-Issue cache `build.yml` saves, so this job's queue read fetches what changed, not every page.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.closed-issues.json
          key: closed-issues-restore
          restore-keys: closed-issues-
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          ORDERS_CLOSED_CACHE: ${{ github.workspace }}/.closed-issues.json
        run: |
          code=0
          python3 loop/orders.py task "$ISSUE" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: another run or a person took the Issue since the pick; that ends this job with no run.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          if [[ "$SLUG" == "repair-$ISSUE" ]]; then
            # L96: a repair run edits its Issue and opens no PR.
            printf '\nOpen no PR; edit Issue #%s. Your Author-Agent id is builder-%s.\n' "$ISSUE" "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          else
            printf '\nBuild on branch build/%s from origin/main. Your Author-Agent id is builder-%s.\n' "$SLUG" "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          fi
          # The prompt goes to a file, not a step output: an env var holds under 128 KiB and a work Issue's body may not.
          GITHUB_OUTPUT="$RUNNER_TEMP/prompt.out" python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          echo 'due=true' >>"$GITHUB_OUTPUT"
      # L23: Codex first, Claude Code when it did no work (Claude Code alone with `CLAUDE_API` set); `after` puts a non-empty `ask` to the user (`.agents/builder.md`, L79).
      - id: engine
        name: Run Claude Code, then Codex
        if: steps.task.outputs.due == 'true'
        # L23: a backstop for `deadline.py`, which ends the engine at 25 minutes; inside the job's hour, so `keep` runs after it.
        timeout-minutes: 35
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ONLY: ${{ vars.CODEX_ONLY }}
          # Claude Code runs on it, and a Builder's real-`claude` observers sign in with it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_API == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_API != '' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          # `prompt<<DELIMITER`, the prompt, `DELIMITER`: the prompt is what lies between the first and last line.
          sed '1d;$d' "$RUNNER_TEMP/prompt.out" | python3 "$RUNNER_TEMP/loop/builder.py" engine \
            '{"type":"object","properties":{"ask":{"type":"string"}},"required":["ask"],"additionalProperties":false}'
      # L23: the run's App token lasts an hour and a run may not; main's `keep` pushes what the run committed with a
      # fresh one and, with no open PR, opens a draft for L81, before `worked` and the screen read the run.
      - id: keep
        if: always() && steps.task.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/loop/builder.py" keep "build/$SLUG" "$ISSUE"
      # L23: captures need a user token the App token cannot stand in for; only this step holds it, after the model ends.
      # A failure leaves the PR and Issue as they are: captures are evidence for people.
      - id: attach
        if: always() && steps.task.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ATTACH_TOKEN: ${{ secrets.PR_ATTACH_TOKEN }}
        run: python3 "$RUNNER_TEMP/loop/builder.py" attach "build/$SLUG"
      - id: worked
        if: always() && steps.task.outputs.due == 'true'
        env:
          EXECUTION_FILE: ${{ steps.engine.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"
      # L79, L81: Haiku screens what the run asks the user (`.agents/screen.md`), its open draft's `Stopped:` paragraph
      # or, with no PR, a non-empty `ask`; `after` sends it where the verdict says.
      # The answer and verdict travel as an artifact: a job output holding a model answer is dropped when it matches
      # a secret's mask, which lost an ask to the user (#3013).
      - name: Keep the answer
        if: always()
        env:
          ANSWER: ${{ steps.engine.outputs.structured_output }}
        run: mkdir -p "$RUNNER_TEMP/answer" && printf '%s' "$ANSWER" >"$RUNNER_TEMP/answer/answer.txt"
      - id: screen
        if: always() && steps.engine.outputs.structured_output != ''
        env:
          ANSWER: ${{ steps.engine.outputs.structured_output }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_API == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_API != '' && secrets.ANTHROPIC_API_KEY || '' }}
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_API_KEY: ${{ vars.CODEX_ONLY != '' && secrets.OPENAI_API_KEY || '' }}
          CODEX_ONLY: ${{ vars.CODEX_ONLY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$ANSWER" | python3 "$RUNNER_TEMP/loop/builder.py" screen "build/$SLUG" >"$RUNNER_TEMP/answer/verdict.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: answer-${{ inputs.issue }}
          path: ${{ runner.temp }}/answer

  after:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      ISSUE: ${{ inputs.issue }}
      SLUG: ${{ inputs.slug }}
      # A refused, cancelled or timed-out build left no output: no model worked.
      RAN: ${{ needs.build.outputs.ran == 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v6
        continue-on-error: true  # a build that died before its answer step leaves none; `built` then reads an empty answer
        with:
          name: answer-${{ inputs.issue }}
          path: ${{ runner.temp }}/answer
      # L34: the hour's closed-Issue cache `build.yml` saves, so this job's queue read fetches what changed, not every page.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.closed-issues.json
          key: closed-issues-restore
          restore-keys: closed-issues-
      - env:
          ORDERS_CLOSED_CACHE: ${{ github.workspace }}/.closed-issues.json
        run: |
          verdict=$(cat "$RUNNER_TEMP/answer/verdict.txt" 2>/dev/null || true)
          { cat "$RUNNER_TEMP/answer/answer.txt" 2>/dev/null || true; } | python3 loop/builder.py built "$ISSUE" "$SLUG" "$RAN" "$verdict"
      # A GITHUB_TOKEN dispatch starts a workflow; a job where no model worked (a usage limit) ends the chain.
      - if: always() && env.RAN == 'true'
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
