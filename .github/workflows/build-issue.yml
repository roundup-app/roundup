name: build-issue

# L23: one build job and its own `after`, called once per Issue by build.yml's matrix. Each Issue's `after` runs as
# soon as its build ends, so a finished job frees its slot and starts the next pick without waiting for the other
# Issues of its run. `after` holds the write token the Builder never sees.
on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: number
      slug:
        required: true
        type: string

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    # A second job for one Issue waits, then finds the first one's PR and starts no run.
    concurrency:
      group: build-${{ inputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      ran: ${{ steps.worked.outputs.ran }}
      answer: ${{ steps.engine.outputs.structured_output }}
      verdict: ${{ steps.screen.outputs.verdict }}
    env:
      ISSUE: ${{ inputs.issue }}
      SLUG: ${{ inputs.slug }}
      # L23: the switch; set, Claude Code runs on API credit (`loop/builder.py` `claude_env`).
      CLAUDE_API: ${{ vars.CLAUDE_API }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The Builder switches this checkout to its branch; the end of the job runs main's copy.
      - run: cp -R loop "$RUNNER_TEMP/loop" && mkdir "$RUNNER_TEMP/.agents" && cp .agents/screen.md "$RUNNER_TEMP/.agents/"
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          builder: 'true'
      - name: Stamp Builder commits
        run: bash loop/author.sh "builder-$GITHUB_RUN_ID"
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          python3 loop/orders.py task "$ISSUE" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: another run or a person took the Issue since the pick; that ends this job with no run.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          if [[ "$SLUG" == repair-* ]]; then
            # L96: a repair run edits its Issue and opens no PR.
            printf '\nOpen no PR; edit Issue #%s. Your Author-Agent id is builder-%s.\n' "$ISSUE" "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          else
            printf '\nBuild on branch build/%s from origin/main. Your Author-Agent id is builder-%s.\n' "$SLUG" "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          fi
          python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          echo 'due=true' >>"$GITHUB_OUTPUT"
      # L23: Codex first, Claude Code when it did no work (Claude Code alone with `CLAUDE_API` set); `after` puts a non-empty `ask` to the user (`.agents/builder.md`, L79).
      - id: engine
        name: Run Claude Code, then Codex
        if: steps.task.outputs.due == 'true'
        # L23: inside the job's two hours, so `keep` runs after the longest run.
        timeout-minutes: 105
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_ONLY: ${{ vars.CODEX_ONLY }}
          # Claude Code runs on it, and a Builder's real-`claude` observers sign in with it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_API == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_API != '' && secrets.ANTHROPIC_API_KEY || '' }}
          PROMPT: ${{ steps.task.outputs.prompt }}
        run: |
          printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/loop/builder.py" engine \
            '{"type":"object","properties":{"ask":{"type":"string"}},"required":["ask"],"additionalProperties":false}'
      # L23: the run's App token lasts an hour and a run may not; main's `keep` pushes what the run committed with a
      # fresh one and, with no open PR, opens a draft for L81, before `worked` and the screen read the run.
      - id: keep
        if: always() && steps.task.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/loop/builder.py" keep "build/$SLUG" "$ISSUE"
      - id: worked
        if: always() && steps.task.outputs.due == 'true'
        env:
          EXECUTION_FILE: ${{ steps.engine.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"
      # L79, L81: Haiku screens what the run asks the user (`.agents/screen.md`), its open draft's `Stopped:` paragraph
      # or, with no PR, a non-empty `ask`; `after` sends it where the verdict says.
      - id: screen
        if: always() && steps.engine.outputs.structured_output != ''
        env:
          ANSWER: ${{ steps.engine.outputs.structured_output }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_API == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_API != '' && secrets.ANTHROPIC_API_KEY || '' }}
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_ONLY: ${{ vars.CODEX_ONLY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(printf '%s' "$ANSWER" | python3 "$RUNNER_TEMP/loop/builder.py" screen "build/$SLUG")
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"

  after:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      ISSUE: ${{ inputs.issue }}
      SLUG: ${{ inputs.slug }}
      # A refused, cancelled or timed-out build left no output: no model worked.
      RAN: ${{ needs.build.outputs.ran == 'true' }}
      ANSWER: ${{ needs.build.outputs.answer }}
      VERDICT: ${{ needs.build.outputs.verdict }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - run: printf '%s' "$ANSWER" | python3 loop/builder.py built "$ISSUE" "$SLUG" "$RAN" "$VERDICT"
      # A GITHUB_TOKEN dispatch starts a workflow; a job where no model worked (a usage limit) ends the chain.
      - if: always() && env.RAN == 'true'
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
