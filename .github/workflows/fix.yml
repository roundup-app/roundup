name: fix
run-name: "${{ format('Fix PR #{0}: {1}', inputs.pr || github.event.workflow_run.pull_requests[0].number, inputs.cause || (github.event.workflow_run.name == 'loop' && 'rules' || 'check')) }}"

# L82: a fix run answers one cause on a Builder PR: a failed check or rules run, a reject, a conflict with main, or a
# draft its run left unfinished. A conflict only in generated files is resolved by a script with no model run, and so is a `rules` failure only on `rules.sh merge-loss` (L120), by restoring main's
# version of each file it lists. A PR gets
# three fix runs that worked; the fourth cause closes the PR, deletes its branch and hands its Issue the causes. The fix run, on Claude Code or Codex (L23), pushes with the Claude App's token, so its push starts check, then review, again.
# A reject answered with no push (a body edit) has `after` rerun its review run, since no check ends to start one.
# A check or rules run that a newer run on the same head superseded starts no fix run and counts no attempt, and neither
# does a plumbing cause (a conflict, a `rules` failure about PR shape): it gets a run with no comment, up to six per PR.
on:
  workflow_run:
    workflows: [check, loop]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Builder PR to fix
        required: true
      head:
        description: Its head when the cause was seen; a moved head means the cause is gone
        required: true
      cause:
        description: What to fix
        required: true
        type: choice
        options: [check, rules, review, critic, conflict, unfinished]

# One fix run per PR at a time; the next one finds a moved head and starts no run. A run with nothing to fix gets its
# own group, so it never replaces a fix run waiting in the PR's group.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure') &&
    format('fix-{0}', inputs.pr || github.event.workflow_run.pull_requests[0].number) ||
    format('fix-none-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  task:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'build/') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.task.outputs.pr }}
      branch: ${{ steps.task.outputs.branch }}
      cause: ${{ steps.task.outputs.cause }}
      plumbing: ${{ steps.task.outputs.plumbing }}
      merge_loss: ${{ steps.task.outputs.merge_loss }}
      prompt: ${{ steps.task.outputs.prompt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD: ${{ inputs.head || github.event.workflow_run.head_sha }}
          CAUSE: ${{ inputs.cause || (github.event.workflow_run.name == 'loop' && 'rules' || 'check') }}
          CODEX_RUNS: ${{ vars.CODEX_RUNS }}
        run: |
          code=0
          python3 loop/builder.py fix-task "$PR" "$HEAD" "$CAUSE" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: the cause is gone, the PR is not a Builder's, or it used its fix runs.
          [ "$code" != 3 ] || exit 0
          [ "$code" = 0 ] || exit "$code"
          printf '\nYour Author-Agent id is builder-%s.\n' "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          {
            echo "branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)"
            echo "pr=$PR"
            echo "cause=$CAUSE"
          } >>"$GITHUB_OUTPUT"

  fix-run:
    needs: task
    if: needs.task.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      ran: ${{ steps.ran.outputs.ran }}
      verdict: ${{ steps.screen.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.task.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      # main picks the runner setup and runs the end of the job; the PR's copies may be stale or changed.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .loop-main
          sparse-checkout: |
            .agents
            .github/actions/setup
            loop
          persist-credentials: false
      - uses: ./.loop-main/.github/actions/setup
        with:
          browser: 'true'
          builder: 'true'
      - name: Stamp Builder commits
        run: |
          bash .loop-main/loop/author.sh "builder-$GITHUB_RUN_ID"
          mv .loop-main "$RUNNER_TEMP/main"
      # L82: a conflict only in generated files (`GENERATED` in `loop/builder.py`) is merged, regenerated and committed by a
      # script, which `keep` below pushes; the model never starts. Any other conflict, or a failed regenerate, leaves the
      # branch as it was and the engine runs as for any conflict.
      - id: resolve
        if: needs.task.outputs.cause == 'conflict'
        run: |
          resolved=false
          if python3 "$RUNNER_TEMP/main/loop/builder.py" resolve-generated; then resolved=true; fi
          echo "resolved=$resolved" >>"$GITHUB_OUTPUT"
      # L120: a `rules` failure only on `rules.sh merge-loss` is repaired by a script, which restores main's version of each
      # file it lists, commits it and reruns `merge-loss`, which `keep` below pushes; the model never starts, no comment is
      # posted and no attempt counts. A rerun that still fails restores the branch and the engine runs as for any rules failure.
      - id: restore
        if: needs.task.outputs.merge_loss == 'true'
        run: |
          restored=false
          if python3 "$RUNNER_TEMP/main/loop/builder.py" restore-merge-loss; then restored=true; fi
          echo "restored=$restored" >>"$GITHUB_OUTPUT"
      # L23: Claude Code on Sonnet with the Max token, Codex on the user's ChatGPT plan when it did no work.
      - id: engine
        if: steps.resolve.outputs.resolved != 'true' && steps.restore.outputs.restored != 'true'
        name: Run Claude Code, then Codex
        # L23: inside the job's two hours, so `keep` runs after the longest run.
        timeout-minutes: 105
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          # Claude Code runs on it, and a Builder's real-`claude` observers sign in with it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/main/loop/builder.py" engine
      # L82: a fix run that outlives the App token's hour keeps its commits through main's `keep` (L23).
      - id: keep
        if: always()
        env:
          BRANCH: ${{ needs.task.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/main/loop/builder.py" keep "$BRANCH"
      - id: ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.engine.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/main/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"
      # L79, L81: Haiku screens the `Stopped:` paragraph of the draft the run left (main's `.agents/screen.md`); `after`
      # sends it where the verdict says.
      - id: screen
        if: always() && steps.ran.outputs.ran == 'true'
        env:
          BRANCH: ${{ needs.task.outputs.branch }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(python3 "$RUNNER_TEMP/main/loop/builder.py" screen "$BRANCH" </dev/null)
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"
      # The setup action's post steps (cache saves) run from .loop-main after the last step.
      - if: always()
        run: if [ -d "$RUNNER_TEMP/main" ]; then mv "$RUNNER_TEMP/main" .loop-main; fi

  after:
    needs: [task, fix-run]
    if: ${{ !cancelled() && needs.task.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.task.outputs.pr }}
          CAUSE: ${{ needs.task.outputs.cause }}
          RAN: ${{ needs.fix-run.outputs.ran || 'false' }}
          VERDICT: ${{ needs.fix-run.outputs.verdict }}
          PLUMBING: ${{ needs.task.outputs.plumbing || 'false' }}
        run: python3 loop/builder.py fixed "$PR" "$CAUSE" "$RAN" "$VERDICT" "$PLUMBING"
      # L23: as a build's `after` does, a fix run whose model worked starts `pick`, so the slot it freed fills and a repair
      # a full slot count refused starts; a run where no model worked (a usage limit) ends the chain.
      - if: always() && needs.fix-run.outputs.ran == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main

  summary:
    needs: [task, fix-run, after]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Fix a Builder PR
      next: The fix run's push starts check and review again, or a reject answered with no push reruns its review run; a draft
        with a Stopped line goes where its screen sends it.
