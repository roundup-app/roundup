name: fix
# L82 retry-contract: 1 — full-run retries reenter admission, branch exclusion and task.
run-name: "Fix PR #${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}: ${{ inputs.cause || (github.event.workflow_run.name == 'loop' && 'rules' || 'check') }} @ ${{ inputs.head || github.event.workflow_run.head_sha }}"

# L82: a fix run answers one cause on a Builder PR: a failed check or rules run, a reject of the review or the critic (L103), a conflict with main, or a
# draft its run left unfinished; its task adds a conflict and a reject of the head that no fix run answered. A PR gets three fix runs that count an attempt; the next cause that would count one closes the PR, deletes its
# branch and hands its Issue the causes. The fix run, on Codex, pushes with the Claude App's token, so its push starts check, then review, again.
# A reject answered with no push (a body edit) has `after` rerun its review run, since no check ends to start one.
# A check or rules failure main caused, or one a newer run on the same head superseded, starts no fix run and counts no
# attempt; once main passes again, the run only merges main into the PR and counts no attempt. A task naming only a
# conflict counts no attempt either, three times per PR.
on:
  workflow_run:
    workflows: [check, loop]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Builder PR to fix
        required: true
      head:
        description: Its head when the cause was seen; a moved head means the cause is gone
        required: true
      cause:
        description: What to fix
        required: true
        type: choice
        options: [check, rules, review, critic, conflict, unfinished, answered]

# Admission runs immediately; only an admitted fix waits on the shared branch lock.
permissions:
  contents: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  branch:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'build/') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: read
      actions: read
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" measurement-start
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD: ${{ inputs.head || github.event.workflow_run.head_sha }}
          CAUSE: ${{ inputs.cause || (github.event.workflow_run.name == 'loop' && 'rules' || 'check') }}
          CODEX_RUNS: ${{ vars.CODEX_RUNS }}
        run: |
          trap 'cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/summary.md"' EXIT
          code=0
          python3 loop/builder.py fix-admit "$PR" "$HEAD" "$CAUSE" >>"$GITHUB_STEP_SUMMARY" || code=$?
          if [ "$code" = 3 ]; then exit 0; fi
          if [ "$code" != 0 ]; then exit "$code"; fi
          branch=$(timeout 60s gh pr view "$PR" --json headRefName --jq .headRefName)
          if [[ "$branch" != build/* ]]; then
            echo 'Skip fix: this is not a Builder branch.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          printf 'Fix queued for branch `%s`; it waits for any build or fix holding the branch.\n' "$branch" >>"$GITHUB_STEP_SUMMARY"
      - name: Finish API measurement
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" measurement-finish
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-api-fix-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  fix:
    needs: branch
    if: needs.branch.outputs.branch != ''
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/fix-branch.yml
    secrets: inherit
    with:
      branch: ${{ needs.branch.outputs.branch }}
      pr: ${{ inputs.pr || format('{0}', github.event.workflow_run.pull_requests[0].number) }}
      head: ${{ inputs.head || github.event.workflow_run.head_sha }}
      cause: ${{ inputs.cause || (github.event.workflow_run.name == 'loop' && 'rules' || 'check') }}
