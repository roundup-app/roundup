name: pre
# The same titles as `check`: a draft's event is marked, so a later `ready_for_review` completion cannot be mistaken for it.
run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft check' || 'Check' }}

# The cheap gate: a PR head's lints (no test shard, no macOS runner), beside the tests of `check`. A push to `main` runs
# the lints here too.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push cancels an older run; a draft's run has its own group, as `check`'s has. A push to `main` cancels the
# `main` run before it, running or waiting (scenarios/ci-mac.md).
concurrency:
  group: pre-${{ github.event_name == 'push' && 'push-main' || (github.event.pull_request.draft && format('draft-{0}', github.ref) || github.ref) }}
  cancel-in-progress: true

# L89: a PR's lints run only where its diff reaches (`loop/affected.py`), as `check`'s lanes do; an empty base, on a push to
# `main`, runs everything.
env:
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # L89: what the diff reaches decides whether `lint-web` runs; a lint the diff misses is skipped at job level and holds no
  # runner. The runner's own cargo suffices, as in `check`.
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.plan.outputs.web }}
    steps:
      # HEAD^1, the diff base, is all the plan reads; the full fetch of every branch took up to 47 minutes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: plan
        run: |
          reached=$(python3 loop/affected.py web "$BASE")
          echo "web=${reached:+true}" >>"$GITHUB_OUTPUT"

  # L89: the Rust checks that run no test binary.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # The lint ratchets diff against `git merge-base HEAD origin/main`; recent `main` history is all they read.
      # Through merges, depth 200 spans thousands of commits that hold the 2.5 GB of evidence #5484 removed; blobs load on demand.
      - run: git fetch --no-tags --depth=200 --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
      - uses: ./.github/actions/setup
      - run: python3 loop/app-data.py just lint-rust

  # L89: the web checks that run no test.
  lint-web:
    needs: plan
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.plan.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # The lint ratchets diff against `git merge-base HEAD origin/main`; recent `main` history is all they read.
      # Through merges, depth 200 spans thousands of commits that hold the 2.5 GB of evidence #5484 removed; blobs load on demand.
      - run: git fetch --no-tags --depth=200 --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          browser: 'true'
      - run: python3 loop/app-data.py just lint-web

  # The lints' one result. A failed lint cannot turn it green; a skipped one can only on a PR, where `plan` (which must
  # itself succeed) skipped it, as `check` reads its lanes (L89).
  pre:
    needs: [plan, lint, lint-web]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT" 'map_values(.result) | ., (.plan == "success" and all(.[]; . == "success" or ($event == "pull_request" and . == "skipped")))' <<<"$NEEDS"
