name: stall
run-name: Look for a loop stall

# L94: hourly, on its own, with no model. A stall opens or updates one work Issue; a merge closes it.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed successful Codex build to observe
        type: string
        required: false

permissions:
  issues: write
  contents: read
  pull-requests: read
  actions: read

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  stall:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: stall
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 loop/stall.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Observe completed Codex build
        if: github.event_name == 'workflow_dispatch' && inputs.build_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          python3 loop/stall.py observe "$BUILD_RUN" > /tmp/observation.txt
          printf '\nObserver: https://github.com/%s/actions/runs/%s\nMain: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" >> /tmp/observation.txt
          cat /tmp/observation.txt
          gh issue comment 1285 --body-file /tmp/observation.txt
