name: loop

on:
  pull_request:

concurrency:
  group: loop-${{ github.ref }}
  cancel-in-progress: true

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  rules:
    runs-on: ubuntu-latest
    # L89: a failed step leaves the later ones running, so one run reports every failure.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: loop/rules.sh ci-trailers "$PR"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: loop/rules.sh frozen "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: loop/rules.sh scenario-closes "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - run: loop/rules.sh merge-loss
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      - run: loop/rules.sh vocab
        if: ${{ !cancelled() }}
      - run: loop/rules.sh architect-words
        if: ${{ !cancelled() }}
      - run: loop/rules.sh tokens
        if: ${{ !cancelled() }}
      - run: python3 loop/orders.py lint
        if: ${{ !cancelled() }}
      - run: python3 loop/orders.test.py
        if: ${{ !cancelled() }}
      - uses: taiki-e/install-action@just
        if: ${{ !cancelled() }}
      - run: python3 loop/builder.test.py
        if: ${{ !cancelled() }}
      - run: python3 loop/stall.test.py
        if: ${{ !cancelled() }}
      - run: python3 loop/workflows.test.py
        if: ${{ !cancelled() }}
      - run: loop/rules.test.sh
        if: ${{ !cancelled() }}
      - run: loop/qa-sweep.test.sh
        if: ${{ !cancelled() }}

  summary:
    needs: [rules]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check loop rules and regressions
      next: A failure blocks merge and starts a fix run on a Builder PR.
