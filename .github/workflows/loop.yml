name: loop

on:
  pull_request:

concurrency:
  group: loop-${{ github.ref }}
  cancel-in-progress: true

# L98: bash -eo pipefail, so a failure left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  rules:
    runs-on: ubuntu-24.04
    # L89: a failed step leaves the later ones running, so one run reports every failure.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: loop/rules.sh merge-loss
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      - run: loop/rules.sh vocab
        if: ${{ !cancelled() }}
      - run: loop/rules.sh architect-words
        if: ${{ !cancelled() }}
      - run: loop/rules.sh tokens
        if: ${{ !cancelled() }}
      - run: python3 loop/orders.py lint
        if: ${{ !cancelled() }}
      - run: python3 loop/orders.test.py
        if: ${{ !cancelled() }}
      - uses: taiki-e/install-action@just
        if: ${{ !cancelled() }}
      - run: python3 loop/builder.test.py
        if: ${{ !cancelled() }}
      - run: python3 loop/push.test.py
        if: ${{ !cancelled() }}
      - run: python3 loop/deadline.test.py
        if: ${{ !cancelled() }}
      - run: python3 loop/image_tools.test.py
        if: ${{ !cancelled() }}
      - run: python3 loop/codex_login.test.py
        if: ${{ !cancelled() }}
      - run: python3 loop/stall.test.py
        if: ${{ !cancelled() }}
      - name: Select boxd regressions
        id: boxd-changes
        if: ${{ !cancelled() }}
        run: |
          tests=$(python3 loop/affected.py boxd HEAD^1)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v5
        if: ${{ !cancelled() && steps.boxd-changes.outputs.tests == 'all' }}
      - name: L121 boxd runner and retained-memory regressions
        if: ${{ !cancelled() && steps.boxd-changes.outputs.tests == 'all' }}
        run: |
          pnpm install --filter @roundup/agent-runners --frozen-lockfile --ignore-scripts
          pnpm --filter @roundup/agent-runners test:runners
      - run: loop/rules.test.sh
        if: ${{ !cancelled() }}
      - run: loop/qa-sweep.test.sh
        if: ${{ !cancelled() }}

  summary:
    needs: [rules]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Check loop rules and regressions
      next: A failure blocks merge and starts a fix run on a Builder PR.
