name: fix-branch

# L23, L82: acquire the same branch group as build before task preparation can write.
on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: string
      head:
        required: true
        type: string
      cause:
        required: true
        type: string
      branch:
        required: true
        type: string

concurrency:
  group: branch-${{ inputs.branch }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  task:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.task.outputs.pr }}
      branch: ${{ steps.task.outputs.branch }}
      cause: ${{ steps.task.outputs.cause }}
      head: ${{ steps.task.outputs.head }}
      prompt: ${{ steps.task.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          BRANCH: ${{ inputs.branch }}
          CAUSE: ${{ inputs.cause }}
        run: |
          trap 'cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/summary.md"' EXIT
          printf 'Fix acquired branch `%s`; task preparation waits for any build or fix holding it to end.\n' "$BRANCH" >>"$GITHUB_STEP_SUMMARY"
          current=$(timeout 60s gh pr view "$PR" --json headRefOid --jq .headRefOid)
          printf 'Observed head: `%s`; cause head: `%s`.\n' "$current" "$HEAD" >>"$GITHUB_STEP_SUMMARY"
          if [ "$current" != "$HEAD" ]; then
            echo 'Skip fix: the build or another writer moved the head; the original cause belongs to an older head. The newest head gets its own checks and fix.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=0
          python3 loop/builder.py fix-task "$PR" "$HEAD" "$CAUSE" >"$RUNNER_TEMP/task.md" || code=$?
          # 3: the cause is gone, the PR is not a Builder's, main failed it and still fails or has not ended, or it used
          # its fix runs.
          if [ "$code" = 3 ]; then
            printf 'Skip fix: the cause is stale or ineligible (moved/closed/held PR, superseded failure, main failure, or exhausted attempts). No fix model started.\n' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" = 0 ] || exit "$code"
          printf '\nYour Author-Agent id is builder-%s.\n' "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          {
            echo "branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)"
            echo "pr=$PR"
            echo "cause=$CAUSE"
            echo "head=$HEAD"
          } >>"$GITHUB_OUTPUT"

  fix-run:
    name: 'fix #${{ needs.task.outputs.pr }} ${{ needs.task.outputs.head }}'
    needs: task
    if: needs.task.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      ran: ${{ steps.ran.outputs.ran }}
      verdict: ${{ steps.screen.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.task.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      # main picks the runner setup and runs the end of the job; the PR's copies may be stale or changed.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .loop-main
          sparse-checkout: |
            .agents
            .github/actions/setup
            loop
          persist-credentials: false
      - uses: ./.loop-main/.github/actions/setup
        with:
          browser: 'true'
          builder: 'true'
      - name: Stamp Builder commits
        run: |
          bash .loop-main/loop/author.sh "builder-$GITHUB_RUN_ID"
          mv .loop-main "$RUNNER_TEMP/main"
      # L23: Codex on the user's ChatGPT plan.
      - id: codex
        name: Run Codex
        # L23: inside the job's two hours, so `keep` runs after the longest run.
        timeout-minutes: 105
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          # A Builder's real-`claude` observers sign in with it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/main/loop/builder.py" codex gpt-6.1-sol
      # L82: a fix run that outlives the App token's hour keeps its commits through main's `keep` (L23).
      - name: Refresh read budget after the model
        if: always()
        run: python3 "$RUNNER_TEMP/main/loop/builder.py" read-token
      - id: keep
        if: always()
        env:
          BRANCH: ${{ needs.task.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/main/loop/builder.py" keep "$BRANCH"
      - id: ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.codex.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/main/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"
      # L79, L81: Haiku screens the `Stopped:` paragraph of the draft the run left (main's `.agents/screen.md`); `after`
      # sends it where the verdict says.
      - id: screen
        if: always() && steps.ran.outputs.ran == 'true'
        env:
          BRANCH: ${{ needs.task.outputs.branch }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(python3 "$RUNNER_TEMP/main/loop/builder.py" screen "$BRANCH" </dev/null)
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"
      # The setup action's post steps (cache saves) run from .loop-main after the last step.
      - if: always()
        run: if [ -d "$RUNNER_TEMP/main" ]; then mv "$RUNNER_TEMP/main" .loop-main; fi

  after:
    needs: [task, fix-run]
    if: ${{ !cancelled() && needs.task.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.task.outputs.pr }}
          CAUSE: ${{ needs.task.outputs.cause }}
          RAN: ${{ needs.fix-run.outputs.ran || 'false' }}
          VERDICT: ${{ needs.fix-run.outputs.verdict }}
          HEAD: ${{ needs.task.outputs.head }}
        run: python3 loop/builder.py fixed "$PR" "$CAUSE" "$RAN" "$VERDICT" "$HEAD"

  summary:
    needs: [task, fix-run, after]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Fix a Builder PR
      next: The fix run's push starts check and review again, or a reject answered with no push reruns its review run; a draft
        with a Stopped line goes where its screen sends it.
