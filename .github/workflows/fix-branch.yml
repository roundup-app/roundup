name: fix-branch

# L23, L82: acquire the same branch group as build before task preparation can write.
on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: string
      head:
        required: true
        type: string
      cause:
        required: true
        type: string
      branch:
        required: true
        type: string

concurrency:
  group: branch-${{ inputs.branch }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  task:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.task.outputs.pr }}
      branch: ${{ steps.task.outputs.branch }}
      cause: ${{ steps.task.outputs.cause }}
      head: ${{ steps.task.outputs.head }}
      prompt: ${{ steps.task.outputs.prompt }}
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            timeout 60s git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" start-measurement
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - id: task
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          BRANCH: ${{ inputs.branch }}
          CAUSE: ${{ inputs.cause }}
        run: |
          trap 'cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/summary.md"' EXIT
          printf 'Fix acquired branch `%s`; task preparation waits for any build or fix holding it to end.\n' "$BRANCH" >>"$GITHUB_STEP_SUMMARY"
          code=0
          python3 loop/builder.py fix-task "$PR" "$HEAD" "$CAUSE" >"$RUNNER_TEMP/task.md" 2>"$RUNNER_TEMP/refusal.md" || code=$?
          cat "$RUNNER_TEMP/refusal.md" >>"$GITHUB_STEP_SUMMARY"
          # 3: the cause is gone, the PR is not a Builder's, main failed it and still fails or has not ended, or it used
          # its fix runs.
          if [ "$code" = 3 ]; then
            exit 0
          fi
          [ "$code" = 0 ] || exit "$code"
          printf '\nYour Author-Agent id is builder-%s.\n' "$GITHUB_RUN_ID" >>"$RUNNER_TEMP/task.md"
          python3 loop/builder.py prompt <"$RUNNER_TEMP/task.md"
          {
            echo "branch=$BRANCH"
            echo "pr=$PR"
            echo "cause=$CAUSE"
            echo "head=$HEAD"
          } >>"$GITHUB_OUTPUT"
      - name: Finish API measurement
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" finish-measurement
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     token_source='unknown', resource='all', used=None, remaining=None, reset=None,
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: loop-api-fix-branch-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  fix-run:
    name: 'fix #${{ needs.task.outputs.pr }} ${{ needs.task.outputs.head }}'
    needs: task
    if: needs.task.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      ran: ${{ steps.ran.outputs.ran }}
      verdict: ${{ steps.screen.outputs.verdict }}
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            timeout 60s git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" start-measurement
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.task.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      # main picks the runner setup and runs the end of the job; the PR's copies may be stale or changed.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .loop-main
          sparse-checkout: |
            .agents
            .github/actions/setup
            loop
          persist-credentials: false
      - uses: ./.loop-main/.github/actions/setup
        with:
          browser: 'true'
          builder: 'true'
      - name: Stamp Builder commits
        run: |
          bash .loop-main/loop/author.sh "builder-$GITHUB_RUN_ID"
          mv .loop-main "$RUNNER_TEMP/main"
      # L23: Codex on the user's ChatGPT plan.
      - id: codex
        name: Run Codex
        # L23: inside the job's two hours, so `keep` runs after the longest run.
        timeout-minutes: 105
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          # A Builder's real-`claude` observers sign in with it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: ${{ needs.task.outputs.prompt }}
        run: printf '%s' "$PROMPT" | python3 "$RUNNER_TEMP/main/loop/builder.py" codex gpt-6.1-sol
      # L82: a fix run that outlives the App token's hour keeps its commits through main's `keep` (L23).
      - name: Refresh read budget after the model
        if: always()
        run: python3 "$RUNNER_TEMP/main/loop/builder.py" read-token
      - id: keep
        if: always()
        env:
          BRANCH: ${{ needs.task.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/main/loop/builder.py" keep "$BRANCH"
      # L112: main publishes data; readiness still arms all independent required gates.
      - id: captures
        if: always() && steps.keep.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_BRANCH: ${{ needs.task.outputs.branch }}
        run: bash "$RUNNER_TEMP/main/loop/rules.sh" capture-run prepare "$CAPTURE_BRANCH" "$RUNNER_TEMP/capture-publication"
      - id: capture-upload
        if: ${{ !cancelled() && steps.captures.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.captures.outputs.name }}
          path: ${{ steps.captures.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Link capture publication or keep draft
        if: ${{ always() && steps.captures.outputs.pr != '' && steps.captures.outputs.path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_PR: ${{ steps.captures.outputs.pr }}
          CAPTURE_URL: ${{ steps.capture-upload.outputs.artifact-url }}
        run: bash "$RUNNER_TEMP/main/loop/rules.sh" capture-run publish "$CAPTURE_PR" "$RUNNER_TEMP/capture-publication" "$CAPTURE_URL"
      - id: ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.codex.outputs.execution_file }}
        run: |
          ran=false
          if python3 "$RUNNER_TEMP/main/loop/builder.py" worked "$EXECUTION_FILE"; then ran=true; fi
          echo "ran=$ran" >>"$GITHUB_OUTPUT"
      # L79, L81: Haiku screens the `Stopped:` paragraph of the draft the run left (main's `.agents/screen.md`); `after`
      # sends it where the verdict says.
      - id: screen
        if: always() && steps.ran.outputs.ran == 'true'
        env:
          BRANCH: ${{ needs.task.outputs.branch }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(python3 "$RUNNER_TEMP/main/loop/builder.py" screen "$BRANCH" </dev/null)
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"
      # The setup action's post steps (cache saves) run from .loop-main after the last step.
      - if: always()
        run: if [ -d "$RUNNER_TEMP/main" ]; then mv "$RUNNER_TEMP/main" .loop-main; fi
      - name: Finish API measurement
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" finish-measurement
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     token_source='unknown', resource='all', used=None, remaining=None, reset=None,
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: loop-api-fix-branch-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  after:
    needs: [task, fix-run]
    if: ${{ !cancelled() && needs.task.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            timeout 60s git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" start-measurement
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.task.outputs.pr }}
          CAUSE: ${{ needs.task.outputs.cause }}
          RAN: ${{ needs.fix-run.outputs.ran || 'false' }}
          VERDICT: ${{ needs.fix-run.outputs.verdict }}
          HEAD: ${{ needs.task.outputs.head }}
        run: python3 loop/builder.py fixed "$PR" "$CAUSE" "$RAN" "$VERDICT" "$HEAD"
      - name: Finish API measurement
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" finish-measurement
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     token_source='unknown', resource='all', used=None, remaining=None, reset=None,
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: loop-api-fix-branch-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  codex-completion:
    # L23: both workflows use main's observer under one repository-wide completion exclusion.
    needs: [task, fix-run]
    if: ${{ always() && needs.task.outputs.pr != '' }}
    concurrency:
      group: codex-login-completion
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start API measurement before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENT_REF: main
        run: |
          # Git transport bootstraps instrumentation without a non-measurement REST request.
          directory="$RUNNER_TEMP/loop-api-source"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          timeout 120s git -C "$directory" fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$MEASUREMENT_REF"
          for source in builder orders; do
            timeout 60s git -C "$directory" show "FETCH_HEAD:loop/$source.py" > "$directory/$source.py"
          done
          touch "$directory/complete"
          python3 "$directory/builder.py" start-measurement
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read with the App budget
        run: python3 loop/builder.py read-token
      - name: Observe masked Codex completion
        if: always()
        run: python3 loop/builder.py codex-login
      - name: Finish API measurement
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/loop-api-source/complete" ]; then
            python3 "$RUNNER_TEMP/loop-api-source/builder.py" finish-measurement
          else
            python3 - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'loop-api-measurement'
          directory.mkdir(exist_ok=True)
          row = dict(kind='missing', boundary='both', reason='measurement bootstrap failed',
                     token_source='unknown', resource='all', used=None, remaining=None, reset=None,
                     workflow=os.environ['GITHUB_WORKFLOW'], run=os.environ['GITHUB_RUN_ID'], job=os.environ['GITHUB_JOB'],
                     run_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     timestamp=datetime.now(timezone.utc).isoformat())
          (directory / 'records.jsonl').write_text(json.dumps(row) + '\n')
          (directory / 'summary.json').write_text(json.dumps(dict(requests=[], intervals=[], missing=[row])) + '\n')
          PYCODE
          fi
      - name: Retain API measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: loop-api-fix-branch-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loop-api-measurement/records.jsonl
            ${{ runner.temp }}/loop-api-measurement/summary.json
          if-no-files-found: error
          retention-days: 90

  summary:
    needs: [task, fix-run, after]
    if: always()
    permissions: {}
    uses: ./.github/workflows/summary.yml
    with:
      results: ${{ toJSON(needs) }}
      purpose: Fix a Builder PR
      next: The fix run's push starts check and review again, or a reject answered with no push reruns its review run; a draft
        with a Stopped line goes where its screen sends it.
