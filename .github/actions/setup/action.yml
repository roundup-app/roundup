name: setup
description: The toolchain `just check` needs on a macOS or Linux runner, with the workspace's packages installed.
inputs:
  rust:
    description: Install the Rust toolchain and native build tools; `build` installs only the toolchain, restores the Rust cache and builds `rupd` and `rup` while Node installs.
    default: 'true'
  browser:
    description: Install the browser used to inspect the rendered App.
    default: 'false'
  save-cache:
    description: On a push to main, save the Rust cache this job built; only a job that builds every test target sets it (L84).
    default: 'false'
  experiment-cache:
    description: Opt-in isolated CI3781 Rust cache namespace; honored only on hosted Linux pull requests. A new namespace prepares an empty cache, and subsequent runs restore its saved entry.
    default: ''
  node:
    description: Install Node, pnpm and the workspace's packages; `false` for a job whose commands run none (the `mac` lane).
    default: 'true'
  builder:
    description: Install Claude Code, which runs a Builder (L23), screens its ask and runs its real-`claude` observers, and Codex, the Builder's fallback.
    default: 'false'
runs:
  using: composite
  steps:
    # CI5330: setup unpacks the Rust cache (1.9 GB compressed), pnpm and a browser into a 14 GB runner; free the image's unused toolchains first.
    - if: runner.environment != 'self-hosted' && runner.os == 'Linux'
      name: Free runner disk
      shell: bash
      run: bash "${{ github.action_path }}/disk.sh" free
    - if: runner.environment == 'self-hosted'
      name: Verify prepared boxd toolchain
      shell: bash
      run: python3 /opt/roundup-ci/image.py verify "${{ github.action_path }}/action.yml"
    # The browser downloads and its system packages install in about 30 s of waiting on the network: where no Tauri
    # install holds apt's lock, they run in the background while the toolchain, caches and Node install, and `Wait for
    # browser` joins them. Chrome's system libraries are preinstalled on the runner image: `--with-deps` (apt-get update plus
    # installs from a mirror that once served 51 kB/s for 22 min) runs only when `ldd` finds one missing. The package goes to its own prefix: this runs before `setup-node`, on the runner's own Node.
    - if: runner.environment != 'self-hosted' && inputs.browser == 'true' && inputs.rust != 'true'
      name: Start browser install
      shell: bash
      run: |
        prefix="$HOME/.agent-browser-npm"
        echo "$prefix/bin" >>"$GITHUB_PATH"
        setsid bash -c 'npm install -g --prefix "$1" agent-browser@0.27.0 && PATH="$1/bin:$PATH" && agent-browser install && { [ "$(uname)" != Linux ] || ! ldd "$HOME"/.agent-browser/browsers/chrome-*/chrome | grep -q "not found" || agent-browser install --with-deps; }; echo $? >"$2"' _ "$prefix" "$RUNNER_TEMP/browser.status" >"$RUNNER_TEMP/browser.log" 2>&1 </dev/null &
    # The 184 packages download and unpack for about 35 s with nothing else to wait on: they install in the background
    # while the toolchain, caches and Node install, and `Wait for Tauri packages` joins them before anything else takes apt's lock or builds.
    # The 61 MB of packages come from a slow mirror (25 s): a cache of the downloaded archives leaves only the
    # unpacking. The key changes with this file, which names the packages; apt downloads any package the cache holds an older version of,
    # so an older entry restores under `restore-keys` and an edit here never leaves every lane downloading all 61 MB.
    - if: runner.environment != 'self-hosted' && inputs.rust == 'true' && runner.os == 'Linux'
      id: apt-archives
      uses: actions/cache@v5
      with:
        path: ~/apt-archives/*.deb
        key: apt-tauri-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup/action.yml') }}
        restore-keys: apt-tauri-${{ runner.os }}-${{ runner.arch }}-
    - if: runner.environment != 'self-hosted' && inputs.rust == 'true' && runner.os == 'Linux'
      name: Start Tauri packages
      shell: bash
      run: |
        mkdir -p "$HOME/apt-archives/partial"
        # A mirror that crawls at 40 kB/s (26 min for these packages) is not a stall `Acquire::http::Timeout` catches: each
        # attempt gets 3 min, and the next resumes the partial downloads, usually from a faster mirror connection.
        setsid sudo bash -c 'for attempt in 1 2 3 4; do timeout 180 bash -c "apt-get update && apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::archives=$1 libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev jq" && break; done; echo $? >"$2"' _ "$HOME/apt-archives" "$RUNNER_TEMP/apt.status" >"$RUNNER_TEMP/apt.log" 2>&1 </dev/null &
    - if: runner.environment != 'self-hosted' && inputs.rust != 'false'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0
        components: clippy, rustfmt
    # One key per OS for every job that builds the workspace. `check-<OS>` is the check job's own key, so Builders
    # restore the entries main's check saved on their OS (L84). CI3781 opt-in PRs use a separate namespace
    # and may save it on Linux; GitHub scopes those entries to the PR merge ref, inaccessible from main.
    # The first job to save a key keeps it, so a job that builds only part of the workspace never saves.
    # Hash the complete namespace: punctuation stays distinct without entering cache keys.
    - if: runner.environment != 'self-hosted' && inputs.rust != 'false' && runner.os == 'Linux' && github.event_name == 'pull_request' && inputs.experiment-cache != ''
      id: experiment
      shell: bash
      env:
        NAMESPACE: ${{ inputs.experiment-cache }}
      run: |
        digest=$(printf '%s' "$NAMESPACE" | sha256sum)
        echo "namespace=${digest%% *}" >>"$GITHUB_OUTPUT"
    - if: runner.environment != 'self-hosted' && inputs.rust != 'false'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os == 'Linux' && github.event_name == 'pull_request' && inputs.experiment-cache != '' && format('ci3781-{0}', steps.experiment.outputs.namespace) || format('check-{0}', runner.os) }}
        save-if: ${{ inputs.save-cache == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (runner.os == 'Linux' && github.event_name == 'pull_request' && inputs.experiment-cache != '')) }}
    # The build takes about 15 s with nothing else to wait on: it runs in the background while Node installs, and `Wait for
    # daemon build` joins it.
    - if: runner.environment != 'self-hosted' && inputs.rust == 'build'
      name: Start daemon build
      shell: bash
      run: |
        setsid bash -c 'cargo build -p rupd -p rup; echo $? >"$1"' _ "$RUNNER_TEMP/daemon.status" >"$RUNNER_TEMP/daemon.log" 2>&1 </dev/null &
    - if: runner.environment != 'self-hosted' && inputs.rust == 'true'
      uses: taiki-e/install-action@nextest
    - if: runner.environment != 'self-hosted' && inputs.rust == 'true'
      uses: taiki-e/install-action@cargo-machete
    - uses: actions/setup-python@v6
      if: runner.environment != 'self-hosted'
      with:
        python-version: '3.12'
    - if: runner.environment != 'self-hosted' && inputs.node != 'false'
      uses: pnpm/action-setup@v5
    - if: runner.environment != 'self-hosted' && inputs.node != 'false'
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
    - if: runner.environment != 'self-hosted' && inputs.rust == 'true' && runner.os == 'macOS'
      name: GNU coreutils and jq
      shell: bash
      run: |
        brew install coreutils jq
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
    - uses: taiki-e/install-action@just
      if: runner.environment != 'self-hosted'
    - if: inputs.node != 'false'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: runner.environment != 'self-hosted' && inputs.rust == 'true' && runner.os == 'Linux'
      name: Wait for Tauri packages
      shell: bash
      run: |
        until [ -s "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/apt.log"
        [ "$(cat "$RUNNER_TEMP/apt.status")" = 0 ]
    - if: runner.environment != 'self-hosted' && inputs.rust == 'build'
      name: Wait for daemon build
      shell: bash
      run: |
        until [ -s "$RUNNER_TEMP/daemon.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/daemon.log"
        [ "$(cat "$RUNNER_TEMP/daemon.status")" = 0 ]
    - if: runner.environment != 'self-hosted' && inputs.browser == 'true' && inputs.rust == 'true'
      shell: bash
      run: |
        npm install -g agent-browser@0.27.0
        agent-browser install
        if [ "$(uname)" = Linux ] && ldd "$HOME"/.agent-browser/browsers/chrome-*/chrome | grep -q "not found"; then
          agent-browser install --with-deps
        fi
    - if: runner.environment != 'self-hosted' && inputs.browser == 'true' && inputs.rust != 'true'
      name: Wait for browser
      shell: bash
      run: |
        until [ -s "$RUNNER_TEMP/browser.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/browser.log"
        [ "$(cat "$RUNNER_TEMP/browser.status")" = 0 ]
    # `gh pr edit --attach` (a run attaches its rendered captures to its PR, `.agents/data/harness.md`) needs gh 2.102.0.
    - if: runner.environment != 'self-hosted' && inputs.builder == 'true' && runner.os == 'Linux'
      name: GitHub CLI 2.102.0 or later
      shell: bash
      run: |
        want=2.102.0
        have=$(gh --version | awk 'NR == 1 { print $3 }')
        if [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -n 1)" != "$want" ]; then
          dir="gh_${want}_linux_$([ "$(uname -m)" = x86_64 ] && echo amd64 || echo arm64)"
          curl -fsSL "https://github.com/cli/cli/releases/download/v$want/$dir.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/$dir/bin/gh" /usr/local/bin/gh
        fi
        gh --version
    # Codex, and Claude Code at the version claude-code-action 1 pins.
    - if: runner.environment != 'self-hosted' && inputs.builder == 'true'
      shell: bash
      run: |
        npm install -g @openai/codex@0.161.0
        # The installer host answers 429 and 502 at times; retry, then fall back to npm's copy of the same version.
        for wait in 10 30 60; do
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.296 && break
          sleep "$wait"
        done
        command -v "$HOME/.local/bin/claude" >/dev/null || npm install -g @anthropic-ai/claude-code@2.1.296
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"
