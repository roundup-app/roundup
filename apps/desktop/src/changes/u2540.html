<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Agent diff observer</title></head><body><div id="root"></div><script type="module">
import { useBrowserStorage } from "../state/storage";
useBrowserStorage(window.localStorage);
import { createComponent } from "solid-js";
import { render } from "@solidjs/web";
import { App } from "../App";
import { seedApp } from "../testing/seeds";
import { runChecks } from "../testing/checks";
import { railStorage } from "../state/railStorage";
import { RpcError } from "../app/seam";
import { notesFor } from "./notes";
import "../tokens.css";
import "../styles.css";

const dense = new URLSearchParams(location.search).has("dense");

// U7677f: 60 edited lines with 50 notes on them, one of 2,000 characters.
const worst = new URLSearchParams(location.search).has("worst");

// U7690d: ?worst=100 holds 100 notes, a fifth of them on a second file; ?spread holds three notes over two files, so the jump list reads across files.
const count = Number(new URLSearchParams(location.search).get("worst")) || 50;

const spread = new URLSearchParams(location.search).has("spread");

const size = dense ? 10000 : worst ? 60 : 0;


const controls = seedApp("tree-40", Date.now());

const { app } = controls;

// Fixture runs are independent; ?restore explicitly exercises a reload of the same drafts.
if (!new URLSearchParams(location.search).has("restore")) localStorage.removeItem(`roundup:drafts:${app.opened.project.path}`);

if (new URLSearchParams(location.search).has("retention")) {
  const write = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, value) {
    if (key === `roundup:drafts:${app.opened.project.path}`) throw new Error("Storage refused Changes drafts");
    return write.call(this, key, value);
  };
}

const original = app.handlers["rail.tree"];

const worktree = { branch: "roundup/agent-1", base: "main", path: "/p/.roundup/agent-1" };

app.handlers["rail.tree"] = async () => (await original(null) ?? []).map(node => node.id === "agent-1" ? { ...node, worktree } : node);

const path = dense ? `${"directory/".repeat(10)}very-long-file-name.ts` : "src/example.ts";

// U7692: 635 lines edited at 1, 460, 619 and 631, so the text diff folds 450, 150 and 3 unmodified lines.
const folds = new URLSearchParams(location.search).has("folds");

const lines = edits => Array.from({ length: 635 }, (_, i) => `const line${i + 1} = ${i + 1};${edits.includes(i + 1) ? " // edited" : ""}`).join("\n");

const comparison = { base: "original-base-commit", oldPath: path, newPath: path, status: "modified", old: { kind: "text", revision: "original-old", text: folds ? lines([]) : size ? Array.from({ length: size }, (_, i) => `const old${i} = ${i};`).join("\n") : "const first = 1;\nconst second = 2;\n" }, new: { kind: "text", revision: "original-new", text: folds ? lines([1, 460, 619, 631]) : size ? Array.from({ length: size }, (_, i) => `const next${i} = ${i};`).join("\n") : "const first = 3;\nconst second = 4;\n" } };

app.handlers["agent.worktreeState"] = () => ({ ahead: 1, behind: 0, dirty: true });

const files = [{ path, line: 1, status: "modified", counts: size ? { added: size, removed: size } : folds ? { added: 4, removed: 4 } : { added: 2, removed: 2 } }, ...Array.from({ length: dense ? 499 : 1 }, (_, i) => ({ path: `src/file-${i}.ts`, status: "modified", line: 1, counts: { added: 1, removed: 1 }, blob: null }))];

app.handlers["agent.changedFiles"] = () => ({ files });

// U7186c: the Rail icon shows from what the Agent owns, and the Changes view lists the same files.
app.handlers["agent.ownedChanges"] = ({ id }) => ({ groups: id === "agent-1" ? [{ repo: worktree.path, branch: worktree.branch, base: worktree.base, files }] : [] });

app.handlers["agent.compareFile"] = () => comparison;



const failure = await railStorage(app.opened.project.path).write({ selected: "agent-1", collapsed: [] });

if (failure) throw new Error(failure);

window.__fake = controls;

window.__checks = runChecks;

// The existing failure injector can target the next comparison without affecting the tree's reads.
if (new URLSearchParams(location.search).has("failure")) app.handlers["agent.compareFile"] = () => { throw new RpcError(-32001, `Worktree unavailable: ${path}`); };

// A send is accepted, so a note reaches Sent (U7677f); `?submit-failure` refuses it.
app.handlers["message.send"] = ({ to, kind, body, replyTo }) => ({ id: 1, to, kind, body, replyTo, reason: null, status: "pending", from: { kind: "user", id: "user", parent: null }, at: Date.now() });

if (new URLSearchParams(location.search).has("submit-failure")) {
  app.handlers["message.list"] = () => [];
  app.handlers["message.send"] = () => { throw new RpcError(-32003, "Agent refused these notes; edit or retry sending them."); };
}

render(() => createComponent(App, { app, reducedMotion: () => true, clock: Date.now, prepareIdle: open => { window.__worktrees = open.worktrees; } }), document.getElementById("root"));

const elsewhere = { ...comparison, oldPath: "src/file-0.ts", newPath: "src/file-0.ts" };

if (size || spread) {
  // The bottom bar's mounted control registers the App-owned holder before fixture edits enter it.
  if (!document.querySelector(".resource-strip")) await new Promise(resolve => {
    const observer = new MutationObserver(() => {
      if (!document.querySelector(".resource-strip")) return;
      observer.disconnect();
      resolve();
    });
    observer.observe(document.getElementById("root"), { childList: true, subtree: true });
  });
  if (spread) for (const [i, where] of [comparison, elsewhere, comparison].entries()) notesFor(app, app.opened.project.path).save("agent-1", { comparison: where, side: "new", start: i + 1, end: i + 1, source: `const next${i} = ${i};`, text: `Note ${i + 1}: retain original context` });
  if (size) for (let i = 0; i < (dense ? 100 : count); i++) notesFor(app, app.opened.project.path).save("agent-1", { comparison: count > 50 && i % 5 === 4 ? elsewhere : comparison, side: "new", start: i + 1, end: i + 1, source: `const next${i} = ${i};`, text: worst && i === 0 ? "Rename this once the callers agree. ".repeat(56).slice(0, 2000) : `Note ${i + 1}: retain original context ${"long comment ".repeat(5)}` });
}

</script></body></html>
