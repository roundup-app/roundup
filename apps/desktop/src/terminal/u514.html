<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Terminal turns fixture</title></head>
<body style="margin:0"><div id="host" class="pane-screen" style="width:900px;height:500px"></div><script type="module">
import "../tokens.css";
import "../styles.css";
import "./styles.css";
import { createXtermEmulators } from "./emulator";
const OSC = (body) => `\x1b]${body}\x07`;
const turn = (command, output, exit = 0) => OSC("7;file://host/work") + OSC("133;A") + "$ " + OSC("133;B") + command + "\r\n" + OSC("133;C") + output.map((line) => `${line}\r\n`).join("") + OSC(`133;D;${exit}`);
const emulator = createXtermEmulators()("t");
const host = document.getElementById("host");
const marked = new URLSearchParams(location.search).get("marks") !== "none";
const size = emulator.show(host, false);
const tall = new URLSearchParams(location.search).has("tall");
const text = tall ? turn("seq 200", Array.from({ length: 200 }, (_, i) => `${i + 1}`)) : marked ? [turn("one", ["1"]), turn("two", ["2"], 1), turn("three", ["3"])].join("") : "plain\r\ntext\r\n";
emulator.write(new TextEncoder().encode(text), () => { window.__emu = emulator; window.__cols = size.cols; document.body.dataset.ready = "1"; });
</script></body></html>
