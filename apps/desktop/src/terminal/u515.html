<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Send to agent fixture</title></head>
<body style="margin:0"><div id="root" style="width:900px;height:500px;display:flex;flex-direction:column"></div><script type="module">
// U515, U516: a Pane with the real emulator and three Turns, two running Agents (one with `?agents=1`); `window.__calls` holds every `message.send`.
import { createComponent, createSignal } from "solid-js";
import { render } from "solid-js/web";
import "../tokens.css";
import "../styles.css";
import "../buttons.css";
import "../toasts/styles.css";
import { connectProject, ConnectedProjectContext } from "../state/connectedProject";
import { createFakeApp } from "../testing/fakeApp";
import { agent, info, terminal } from "../testing/nodes";
import { createToastQueue } from "../toasts/queue";
import { Toasts } from "../toasts/Toasts";
import { Pane } from "./Pane";
import { createXtermEmulators } from "./emulator";

const OSC = (body) => `\x1b]${body}\x07`;
const turn = (command, output, exit = 0) => OSC("7;file://host/work") + OSC("133;A") + "$ " + OSC("133;B") + command + "\r\n" + OSC("133;C") + output.map((line) => `${line}\r\n`).join("") + OSC(`133;D;${exit}`);
const one = new URLSearchParams(location.search).get("agents") === "1";
const agents = one ? [agent("a", "idle", "waiting", { name: "Alpha" })] : [agent("a", "idle", "waiting", { name: "Alpha" }), agent("b", "working", "busy", { name: "Beta", order: 1 })];
const app = createFakeApp();
const tree = [terminal("sh"), ...agents];
const calls = [];

app.handlers["rail.tree"] = () => tree;
app.handlers["terminal.list"] = () => [info("t-sh")];
app.handlers["terminal.write"] = () => null;
app.handlers["terminal.resize"] = () => null;
app.handlers["terminal.snapshot"] = () => ({ cols: 100, rows: 30, after: 0, data: "" });
app.handlers["message.send"] = (params) => { calls.push(params); return {}; };

const connected = await connectProject(app, { name: "p", path: "/p" }, () => false, () => 0);
const toasts = createToastQueue(createSignal(true)[0], () => {}, () => true);
const make = createXtermEmulators();
let emulator;

window.__calls = calls;
render(() => createComponent(ConnectedProjectContext.Provider, {
  value: connected,
  get children() {
    return [
      createComponent(Pane, { toasts, createEmulator: (id) => { emulator = make(id); window.__emu = emulator; return emulator; } }),
      createComponent(Toasts, { queue: toasts }),
    ];
  },
}), document.getElementById("root"));
connected.rail.select("sh");
await connected.rail.settled();
emulator.write(new TextEncoder().encode(turn("one", ["1"]) + turn("two", ["2"], 1) + turn("three", ["3"])), () => { document.body.dataset.ready = "1"; });
</script></body></html>
