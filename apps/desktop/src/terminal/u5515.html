<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Read-only text observer</title></head><body><div id="root"></div><script type="module">
import { createComponent } from "solid-js";
import { render } from "solid-js/web";
import { App } from "../App";
import { seedApp } from "../testing/seeds";
import PadRichEditor from "../pads/PadRichEditor";
import { runChecks } from "../testing/checks";
import { useBrowserStorage } from "../state/storage";
import "../tokens.css";
import "../styles.css";
// Each load owns its App state; prior editable/Terminal cases must not select its view.
localStorage.clear();
useBrowserStorage(window.localStorage);
const controls = seedApp("tree-40", Date.now());
window.__fake = controls;
window.__checks = runChecks;
render(() => createComponent(App, { app: controls.app, reducedMotion: () => true, clock: Date.now, prepareIdle: connected => {
  connected.drawer.open(() => createComponent(PadRichEditor, {
    text: "Several café words remain selected together\n\n```text\nalpha bravo charlie delta\n```", readonly: true,
    onChange: () => {}, onText: () => {}, onBlur: () => {}, onReady: () => {},
  }), "key");
} }), document.getElementById("root"));
</script></body></html>
