[package]
name = "rupd"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
test-support = ["agents/test-support"]

[dependencies]
async-trait.workspace = true
agents = { path = "../agents" }
base64.workspace = true
contracts = { path = "../contracts" }
memchr = "2"
parking_lot = "0.12"
notify = "8"
messages = { path = "../messages" }
pads = { path = "../pads" }
provenance = { path = "../provenance" }
rpc = { path = "../rpc" }
storage = { path = "../storage" }
rusqlite = { workspace = true, features = ["hooks", "serialize"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
percent-encoding = "2"
url = "2"
terminal = { path = "../terminal" }
todos = { path = "../todos" }
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { workspace = true, features = ["process"] }
cap-std = "4"
thiserror.workspace = true
rustix = { version = "1", features = ["fs"] }
reflink-copy = "0.1.32"

[dev-dependencies]
rusqlite_migration.workspace = true
rupd = { path = ".", features = ["test-support"] }
allocation-counter = "0.8.1"
terminal = { path = "../terminal", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
agents = { path = "../agents", features = ["test-support"] }
jsonschema = { version = "0.60.2", default-features = false }
tempfile.workspace = true
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
