[package]
name = "desktop"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[[bin]]
name = "roundup"
path = "src/main.rs"

[features]
# Makes a release build load the files embedded from frontendDist instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
contracts = { path = "../contracts" }
dirs = "7"
getrandom = "0.3"
rpc = { path = "../rpc" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { workspace = true, features = ["process", "io-util"] }

[[test]]
name = "s2297a"
harness = false

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
rupd = { path = "../rupd" }
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true
tokio.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

# The workspace forbids unsafe code; `src/webkit_rate.rs` alone calls WebKit's private selectors, which `msg_send!` makes unsafe.
[lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
