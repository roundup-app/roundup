[package]
name = "rup"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64.workspace = true
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
contracts = { path = "../contracts" }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "elicitation"] }
rpc = { path = "../rpc" }
schemars = "1"
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
pads = { path = "../pads" }
agents = { path = "../agents" }
checkpoints = { path = "../checkpoints" }
rmcp = { version = "3.5.1", default-features = false, features = ["client"] }
rupd = { path = "../rupd" }
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
