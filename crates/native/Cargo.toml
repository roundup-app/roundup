[package]
name = "native"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
harness = false

[features]
idle-perf = []

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-global-shortcut = "=2.4.1"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "ef6e3090a6083c653955ca0b6e7f6c6ae1453d40" }
tauri-plugin-positioner = "=2.4.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["block2"] }
block2 = "0.6"

# The sole repository-owned native FFI owner. Other crates inherit workspace forbid.
[lints.rust]
unsafe_code = "allow"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
