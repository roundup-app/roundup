[package]
name = "agents"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bigdecimal = "0.4.11"
rangemap = "1.6"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
async-trait.workspace = true
contracts = { path = "../contracts" }
checkpoints = { path = "../checkpoints" }
getrandom = "0.3"
notify = "8"
rpc = { path = "../rpc" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
rusqlite.workspace = true
rusqlite_migration.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
flate2 = "1"
fs-more = "0.8.1"
sha2 = "0.10"
terminal = { path = "../terminal" }
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
unicode-normalization = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
time = { version = "0.3.55", features = ["parsing"] }

[dev-dependencies]
messages = { path = "../messages" }
provenance = { path = "../provenance" }
tokio = { workspace = true, features = ["test-util"] }

[features]
# Fixture entries for another crate's tests; dev-dependencies only.
test-support = []

[lints]
workspace = true
