[package]
name = "agents"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
contracts = { path = "../contracts" }
getrandom = "0.3"
notify = "8"
provenance = { path = "../provenance" }
rpc = { path = "../rpc" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
rusqlite.workspace = true
rusqlite_migration.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
flate2 = "1"
fs-more = "0.8.1"
sha2 = "0.10"
shlex = "2.0.1"
wait-timeout = "0.2.1"
terminal = { path = "../terminal" }
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
unicode-normalization = "0.1"
url = "2"
time = { version = "0.3.55", features = ["parsing"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libproc = "0.14"

[dev-dependencies]
terminal = { path = "../terminal", features = ["test-support"] }
agents = { path = ".", features = ["test-support"] }
stats_alloc = "0.1"
messages = { path = "../messages" }
tokio = { workspace = true, features = ["test-util"] }

[features]
# Fixture entries for another crate's tests; dev-dependencies only.
test-support = []

[lints]
workspace = true
