pre-commit:
  commands:
    lint-web:
      priority: 1
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs,cts}"
      run: node tools/oxlint/anti-slop/web-assertions/lint.mjs --fix --no-error-on-unmatched-pattern -- {staged_files}
      stage_fixed: true
    # CI's debt ratchet (T3797a). Its stdout lists every recorded row, which CI logs keep; findings and failures are on stderr and the exit status.
    lint-web-debt:
      priority: 2
      glob: "apps/desktop/src/*.{js,jsx,ts,tsx,mjs,mts,cjs,cts}"
      run: python3 tools/lint/scan.py oxlint > /dev/null
    file-stays-under-a-size-cap:
      priority: 3
      run: .claude/sound/placement/file-stays-under-a-size-cap.gate --worktree
