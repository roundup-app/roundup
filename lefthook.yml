pre-commit:
  commands:
    lint-web:
      priority: 1
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs,cts}"
      run: node_modules/.bin/lint-staged --config package.json
    file-stays-under-a-size-cap:
      priority: 2
      run: .claude/sound/placement/file-stays-under-a-size-cap.gate --worktree
    rename-leaves-no-stale-name:
      priority: 2
      run: .claude/sound/naming/rename-leaves-no-stale-name.gate
    no-role-named-modules:
      priority: 2
      run: .claude/sound/naming/no-role-named-modules.gate

pre-push:
  commands:
    lint-and-typecheck-the-push:
      use_stdin: true
      run: node tools/oxlint/pre-push.mjs
