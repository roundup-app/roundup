# L89: a failing test stops no other; a check run reports every failure at once.
[profile.default]
fail-fast = false
# L122: a flaky test runs twice before it fails; a pass on the retry is listed as flaky in the
# lane's job summary (`tools/e14/observe.py`). Custom profiles inherit it.
retries = 1

# Tests that assert a product's upper bound on real elapsed time each run alone: no other test shares the
# runner's CPUs while one is timed. They start first, so the wait for a free runner is paid before the rest.
# A test belongs here when it asserts that a real (not paused) clock stayed under a bound the product promises;
# a timeout that only stops a hung wait does not belong.
[[profile.default.overrides]]
filter = '''
(package(terminal) & test(/::(u174_a_write_reaches_the_pty_within_a_frame|x8_a_slow_subscriber_never_blocks_the_reader)$/))
| (package(rupd) & test(/::d8_a_disk_size_is_cached_for_30_s_and_the_walk_never_holds_the_call_past_1_s$/))
| (package(agents) & test(/::(kill_or_already_gone_returns_a_failed_kills_error_without_waiting|a24_start_after_close_in_this_run_settles_within_the_bound|a24_start_after_reopen_settles_within_the_bound|a24_a_start_never_acknowledged_fails_within_the_bound|a24_an_unresumable_conversation_fails_with_a22s_code|a16_a_descendant_holding_the_pty_open_does_not_hang_remove|d9_worktree_state_returns_a_daemon_error_before_the_app_bound)$/))
| (package(rup) & test(/^(d4_wait_returns_once_every_watched_agent_is_idle_not_at_the_deadline|e3_a_daemon_that_never_answers_is_given_up_on_within_five_seconds|d8_ten_idle_agents_with_sampling_stay_under_the_budget|a4_signal_to_a_daemon_that_never_answers_exits_1_in_time|d9_workstream_removal_keeps_finite_shutdown_waits_within_the_app_bound)$/))
| (package(desktop) & test(/^d9_the_app_worktree_(state|provision)_wait_stays_within_the_call_bound$/))
| (package(perf) & binary(large_project) & test(/^r5220_every_read_is_under_budget_/))
'''
threads-required = 'num-test-threads'
priority = 100
# L122: a slow run is the regression this group exists to catch, never a flake to run again.
retries = 0

# L89: the Mac lane runs only the tests that take a macOS path (`target_os = "macos"`) and B6's cleanup_completion
# tests, whose Terminal exit confirmation differs by host PTY; Linux runs the whole suite.
[profile.mac]
default-filter = '''
(package(pads) & test(=p5_a_code_point_apfs_refuses_is_invalid_params))
| (package(desktop) & test(/^open::tests::u(365|429)_/))
| (package(desktop) & test(/^launch::tests::u3787f_/))
| (package(desktop) & binary(s2297a))
| package(native)
| (package(desktop) & test(/^idle::tests::r24_/))
| (package(rup) & binary(project_data) & test(=n1_fallback_uses_a_nested_temporary_home))
| (package(rupd) & test(/::n1_the_default_data_folder_is_the_apps$/))
| (package(rupd) & binary(b6_cleanup_completion))
'''

# AppKit observers share one desktop: fullscreen changes its work area and can
# refuse another process's transition. Include panel/focus observers in the same group.
[test-groups.native-app]
max-threads = 1

[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = '(package(desktop) & binary(s2297a)) | (package(native) & test(=u3787b_native_responder_find_and_close_follow_availability))'
test-group = 'native-app'

# L89: the Rust lanes. A lane runs the test binaries its profile names, packed so the lanes' replayed test time (the
# per-test seconds of a `main` run through nextest's scheduling: four threads in list order, isolated tests alone first)
# is as even as whole binaries allow, with the three CPU-heavy daemon binaries (`perf::flood`, the `rupd` binaries (`order_steering` to `order_base_changes`),
# `b21_stopped_door`) in three lanes: together their timed waits overran. `ci5` is everything the others do not name:
# a new test binary runs in `ci5` until it is packed. Edit the lists together.
[profile.ci1]
default-filter = '''
binary_id(=agents::launch)
| binary_id(=perf::bin/perf)
| binary_id(=perf::r13)
| binary_id(=perf::webview)
| binary_id(=rup::m12)
| binary_id(=rup::models)
| binary_id(=rup::project_data)
| binary_id(=rupd::b21_stopped_door)
| binary_id(=terminal::library_attach)
| binary_id(=todos)
'''

[profile.ci2]
default-filter = '''
binary_id(=agents)
| binary_id(=agents::asks)
| binary_id(=contracts)
| binary_id(=contracts::spawn)
| binary_id(=desktop)
| binary_id(=desktop::h18)
