| (binary_id(=rup::real_claude) & test(/^a32_/))
| binary_id(=rup::t15)
| binary_id(=rupd::h18_handshake)
| binary_id(=terminal::library_edits)
)
)
| (binary_id(=rup::a35) & test(/^a35_[tw]/))
