# macOS allows 127 pseudo-terminals (`kern.tty.ptmx_max`) for the whole runner. The D1 shutdown test
# opens 31 at once, and every package that spawns Terminals (the Daemon's end-to-end tests among them)
# holds some, so those packages' tests run one at a time, never beside each other's Terminals.
[test-groups.pty-heavy]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(rupd) | package(rup) | package(terminal) | package(agents) | package(perf)'
test-group = 'pty-heavy'
