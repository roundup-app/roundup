[files]
# Tool output contains the exact rejected spellings; scanning it would duplicate each exception.
# Perf observations embed raw cargo build logs, with crate names typos flags.
extend-exclude = ["tools/lint/debt.json", "docs/perf-*.json"]

[default.extend-words]
# C9d inventories the installed Highlights alias for Extensible Data Notation.
edn = "edn"
# NA12 quotes a misspelt action name the Daemon must answer with a suggestion.
nwe = "nwe"
