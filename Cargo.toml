[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/rusqlite-0.40.2", "vendor/vt100-0.16.2", "vendor/vte-0.15.0"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.0"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.23"
portable-pty = "0.9"
rusqlite_migration = "2.6"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
ts-rs = "12"
vt100 = "=0.16.2"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[patch.crates-io]
rusqlite = { path = "vendor/rusqlite-0.40.2" }
vt100 = { path = "vendor/vt100-0.16.2" }
vte = { path = "vendor/vte-0.15.0" }

# The Output log feeds every byte a Terminal prints through the parser; tests run unoptimised.
[profile.dev.package.vt100]
opt-level = 3

[profile.dev.package.vte]
opt-level = 3
